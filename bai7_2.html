<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tin học 5 – Bài 7</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.screen{max-width:1000px;margin:auto;padding:20px}
.card{background:#020617;border-radius:20px;padding:25px;text-align:center}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}
.answer{padding:20px;border-radius:15px;font-size:18px;cursor:pointer;transition:.4s}

.a0{background:#ef4444}
.a1{background:#3b82f6}
.a2{background:#facc15;color:black}
.a3{background:#22c55e;color:black}

.zoomCorrect{transform:scale(1.2);box-shadow:0 0 25px #22c55e}
.zoomWrong{transform:scale(.8);opacity:.3}

.shake{animation:shake .4s}
@keyframes shake{
0%{transform:translateX(0)}
25%{transform:translateX(-10px)}
50%{transform:translateX(10px)}
75%{transform:translateX(-10px)}
100%{transform:translateX(0)}
}

.strongShake{animation:strongShake .3s infinite}
@keyframes strongShake{
0%{transform:translateX(0)}
25%{transform:translateX(-15px)}
50%{transform:translateX(15px)}
75%{transform:translateX(-15px)}
100%{transform:translateX(0)}
}

.progress{height:10px;background:#334155;border-radius:5px;overflow:hidden;margin-bottom:10px}
.bar{height:100%;background:#22c55e;width:0%}

#circle{width:120px;margin:auto}
#feedback{font-size:22px;margin-top:10px}
#remain{margin-top:10px;font-size:18px}

button{padding:10px 25px;border-radius:10px;border:none;background:#22c55e;font-size:16px;cursor:pointer;margin-top:15px}

table{width:100%;margin-top:20px;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #334155}
th{color:#22c55e}

canvas{position:fixed;top:0;left:0;pointer-events:none}

.gold{color:#facc15;font-weight:bold;animation:glowGold 1.5s infinite}
.silver{color:#cbd5e1;font-weight:bold;animation:glowSilver 1.5s infinite}
.bronze{color:#f97316;font-weight:bold;animation:glowBronze 1.5s infinite}

@keyframes glowGold{0%{text-shadow:0 0 5px #facc15}50%{text-shadow:0 0 25px #facc15}100%{text-shadow:0 0 5px #facc15}}
@keyframes glowSilver{0%{text-shadow:0 0 5px #cbd5e1}50%{text-shadow:0 0 20px #cbd5e1}100%{text-shadow:0 0 5px #cbd5e1}}
@keyframes glowBronze{0%{text-shadow:0 0 5px #f97316}50%{text-shadow:0 0 20px #f97316}100%{text-shadow:0 0 5px #f97316}}

.bigMedal{font-size:80px;margin:15px;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
</style>
</head>

<body>

<canvas id="fx"></canvas>

<div class="screen">

<div id="start" class="card">
<h2>🧠 TIN HỌC 5 – BÀI 7</h2>
<input id="name" placeholder="Tên HS"><br><br>
<button onclick="begin()">BẮT ĐẦU</button>
</div>

<div id="quiz" class="card" style="display:none">

<div class="progress"><div class="bar" id="bar"></div></div>

<div id="circle">
<svg width="120" height="120">
<circle cx="60" cy="60" r="50" stroke="#334155" stroke-width="8" fill="none"/>
<circle id="ring" cx="60" cy="60" r="50" stroke="#22c55e" stroke-width="8" fill="none"
stroke-dasharray="314" stroke-dashoffset="0"/>
</svg>
<div id="time">20</div>
</div>

<h3 id="q"></h3>
<div id="remain"></div>

<div class="answers" id="ans"></div>
<div id="feedback"></div>

</div>

<div id="end" class="card" style="display:none">
<h2>🎉 HOÀN THÀNH</h2>
<p id="res"></p>

<h3>🏆 BẢNG XẾP HẠNG</h3>
<table id="leaderboard"></table>

<button onclick="restart()">LÀM LẠI</button>
</div>

</div>

<script>

// ===== CONFETTI + FIREWORK =====
const canvas=document.getElementById("fx");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth; canvas.height=innerHeight;

function fireworks(){
for(let i=0;i<150;i++){
ctx.fillStyle=`hsl(${Math.random()*360},100%,50%)`;
ctx.beginPath();
ctx.arc(Math.random()*canvas.width,Math.random()*canvas.height,4,0,6);
ctx.fill();
}
setTimeout(()=>ctx.clearRect(0,0,canvas.width,canvas.height),800);
}

function confetti(){
for(let i=0;i<200;i++){
ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
ctx.fillRect(Math.random()*canvas.width,Math.random()*canvas.height,6,10);
}
setTimeout(()=>ctx.clearRect(0,0,canvas.width,canvas.height),1000);
}

// tick sound
const tickSound=new Audio("https://assets.mixkit.co/sfx/preview/mixkit-clock-ticking-1053.mp3");
const winSound=new Audio("https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3");

// QUESTIONS
let questions=[
["Trước khi định dạng kí tự phải làm gì?",["Chọn văn bản","Đóng Word","Lưu tệp","In"],0],
["Font Size là gì?",["Cỡ chữ","Màu chữ","Phông chữ","Kiểu chữ"],0],
["Font là gì?",["Phông chữ","Cỡ chữ","Màu","Đậm"],0],
["Font Color dùng để?",["Đổi màu chữ","Đổi cỡ","Đổi phông","In đậm"],0],
["Bold dùng để?",["In đậm","In nghiêng","Gạch chân","Tô nền"],0],
["Italic dùng để?",["In nghiêng","In đậm","Gạch chân","Màu"],0],
["Underline dùng để?",["Gạch chân","In nghiêng","In đậm","Tô nền"],0],
["Highlight dùng để?",["Tô nền chữ","Đổi cỡ","Đổi phông","In đậm"],0],
["Ctrl+B là?",["In đậm","In nghiêng","Gạch chân","Lưu"],0],
["Ctrl+I là?",["In nghiêng","In đậm","Gạch chân","Dán"],0],
["Ctrl+U là?",["Gạch chân","In đậm","In nghiêng","Cắt"],0],
["Ctrl+[ ?",["Giảm cỡ chữ","Tăng cỡ","Lưu","In"],0],
["Ctrl+] ?",["Tăng cỡ chữ","Giảm","Cắt","Dán"],0],
["Muốn đổi phông dùng công cụ?",["Font","Size","Color","Bold"],0],
["Muốn đổi cỡ dùng?",["Font Size","Font","Italic","Color"],0],
["Muốn đổi màu chữ?",["Font Color","Font","Size","Bold"],0],
["Muốn văn bản đẹp hơn cần?",["Định dạng","Xóa","Thoát","In"],0],
["Word dùng để?",["Soạn thảo văn bản","Vẽ tranh","Nghe nhạc","Chơi game"],0],
["Các công cụ định dạng nằm ở thẻ?",["Home","View","Insert","File"],0],
["Trước khi đổi màu phải?",["Chọn chữ","Lưu","In","Thoát"],0],
["In nghiêng là?",["Italic","Bold","Underline","Font"],0],
["In đậm là?",["Bold","Italic","Underline","Color"],0],
["Gạch chân là?",["Underline","Bold","Italic","Font"],0],
["Định dạng kí tự giúp?",["Trình bày đẹp","Xóa chữ","Tắt máy","In"],0],
["Ctrl+S là?",["Lưu tệp","In","Cắt","Dán"],0],
["Ctrl+C là?",["Sao chép","Dán","Cắt","In"],0],
["Ctrl+V là?",["Dán","Cắt","Sao chép","Lưu"],0],
["Ctrl+X là?",["Cắt","Dán","Lưu","In"],0],
["Muốn định dạng phải?",["Bôi đen","Thoát","In","Đóng"],0],
["Chọn văn bản nghĩa là?",["Bôi đen","Lưu","Thoát","In"],0],
["Định dạng là?",["Thay đổi hình thức chữ","Xóa","Lưu","Tắt"],0],
["Muốn chữ to hơn?",["Tăng cỡ chữ","Đổi màu","Đổi phông","In đậm"],0],
["Muốn chữ nhỏ lại?",["Giảm cỡ chữ","Tô nền","In","Thoát"],0],
["Nút B nằm trong nhóm?",["Font","Paragraph","Styles","Editing"],0],
["Nút I nằm trong?",["Font","Insert","View","File"],0],
["Nút U nằm trong?",["Font","Save","Print","View"],0],
["Highlight thuộc nhóm?",["Font","Paragraph","Insert","View"],0],
["Đổi màu chữ trước tiên phải?",["Chọn chữ","Thoát","Lưu","In"],0],
["Định dạng áp dụng cho?",["Kí tự","Trang in","Máy","Chuột"],0],
["Muốn thay đổi chữ phải?",["Chọn chữ","Tắt Word","In","Lưu"],0],
["Sau khi định dạng nên?",["Lưu tệp","Thoát","In","Xóa"],0],
["Soạn thảo ca dao thuộc hoạt động?",["Vận dụng","Khởi động","Khám phá","Ghi nhớ"],0],
["Thực hành ở SGK trang?",["28–29","10–11","5–6","40"],0],
["Ghi nhớ nằm ở?",["Trang 27","Trang 1","Trang 15","Trang 40"],0],
["Mục tiêu bài?",["Định dạng kí tự","Vẽ","In","Lưu"],0],
["Kí tự gồm?",["Chữ, số","Chuột","Máy in","Màn hình"],0],
["Định dạng kí tự dùng cho?",["Văn bản","Máy","File","USB"],0],
["Muốn đẹp phải?",["Định dạng","Xóa","In","Thoát"],0],
["Hoàn thành bài cần?",["Tự đánh giá","Tắt máy","In","Xóa"],0]
];
while(questions.length<50)questions.push(...questions.slice(0));

let total=50,i=0,score=0,time=20,clock;

function begin(){
questions.sort(()=>Math.random()-0.5);
i=0;score=0;
start.style.display="none";
quiz.style.display="block";
load();
}

function load(){
if(i>=total){finish();return;}
bar.style.width=(i/total*100)+"%";
remain.innerText="Còn lại: "+(total-i)+" câu";
q.innerText="Câu "+(i+1)+": "+questions[i][0];

let arr=[...questions[i][1]].map((a,j)=>({t:a,i:j}));
arr.sort(()=>Math.random()-0.5);

ans.innerHTML="";
arr.forEach((o,k)=>ans.innerHTML+=`<div class="answer a${k}" data-i="${o.i}" onclick="check(this)">${o.t}</div>`);

reset();
}

function reset(){
clearInterval(clock);
time=20;
quiz.classList.remove("strongShake");
updateCircle();
clock=setInterval(tick,1000);
}

function tick(){
time--;
updateCircle();

if(time<=5 && time>0){ tickSound.currentTime=0; tickSound.play(); }
if(time<=3 && time>0){ quiz.classList.add("strongShake"); }

if(time<=0){
quiz.classList.remove("strongShake");
show(null);
}
}

function updateCircle(){
time=Math.max(time,0);
timeElem.innerText=time;
if(time<=3) ring.style.stroke="#ef4444";
else if(time<=5) ring.style.stroke="#facc15";
else ring.style.stroke="#22c55e";
ring.style.strokeDashoffset=314*(1-time/20);
}

function check(el){
clearInterval(clock);
quiz.classList.remove("strongShake");
show(el);
}

function show(clicked){
document.querySelectorAll(".answer").forEach(e=>{
if(e.dataset.i==0)e.classList.add("zoomCorrect");
else e.classList.add("zoomWrong");
});

if(clicked&&clicked.dataset.i==0){score++;feedback.innerHTML="✅ ĐÚNG!";}
else{feedback.innerHTML="❌ SAI";quiz.classList.add("shake");setTimeout(()=>quiz.classList.remove("shake"),300);}

setTimeout(()=>{i++;load()},1500);
}

function finish(){
quiz.style.display="none";
end.style.display="block";

res.innerText=name.value+" đạt "+score+"/"+total+" điểm";

confetti();
if(score>=40){
fireworks();
setTimeout(fireworks,800);
}

let board=JSON.parse(localStorage.board||"[]");
board.push({name:name.value||"HS",score});
board.sort((a,b)=>b.score-a.score);
board=board.slice(0,10);
localStorage.board=JSON.stringify(board);

let html="<tr><th>Hạng</th><th>Tên</th><th>Điểm</th></tr>";
board.forEach((b,index)=>{
let medal="",cls="";
if(index==0){medal="🥇";cls="gold"}
else if(index==1){medal="🥈";cls="silver"}
else if(index==2){medal="🥉";cls="bronze"}
html+=`<tr class="${cls}"><td>${medal} ${index+1}</td><td>${b.name}</td><td>${b.score}</td></tr>`;
});
leaderboard.innerHTML=html;

let myRank=board.findIndex(b=>b.name==(name.value||"HS")&&b.score==score);
if(myRank>=0&&myRank<3){
winSound.play();
res.innerHTML+=`<div class="bigMedal">${["🥇","🥈","🥉"][myRank]}</div>`;
if(myRank==0){fireworks();setTimeout(fireworks,800);}
}
}

function restart(){location.reload();}

</script>

</body>
</html>
