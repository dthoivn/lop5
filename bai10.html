<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quiz Classroom PRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#eef4ff;
margin:0;
text-align:center
}

.card{
max-width:900px;
margin:auto;
margin-top:20px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15)
}

input{
padding:10px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
width:220px
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px
}

.answer{
padding:18px;
border-radius:12px;
font-size:18px;
cursor:pointer;
transition:.25s;
font-weight:bold
}

.answer:hover{
transform:scale(1.05)
}

.a0{background:#ff7675}
.a1{background:#74b9ff}
.a2{background:#ffeaa7}
.a3{background:#55efc4}

.correct{
background:#2ecc71!important;
transform:scale(1.15)
}

.wrong{
opacity:.3
}

.timer{
font-size:24px;
color:#e74c3c;
font-weight:bold
}

#progressBar{
width:100%;
height:12px;
background:#ddd;
border-radius:10px;
margin-top:15px;
overflow:hidden
}

#progress{
height:100%;
width:0%;
background:#2ecc71
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:10px;
background:#0984e3;
color:white;
cursor:pointer
}

button:hover{
background:#0652dd
}

canvas{
max-width:300px;
margin-top:20px
}

/* mobile */

@media(max-width:600px){

.answers{
grid-template-columns:1fr
}

.answer{
font-size:16px
}

}

</style>
</head>

<body>

<div class="card">

<h2>Quiz Tin học 5 - Bài 10: Cấu trúc rẽ nhánh</h2>

<input id="name" placeholder="Họ tên học sinh">
<br><br>

<input id="class" placeholder="Lớp">
<br><br>

<button onclick="start()">BẮT ĐẦU</button>

<div id="quiz" style="display:none">

<div class="timer" id="time">30:00</div>

<div id="progressBar">
<div id="progress"></div>
</div>

<h3 id="question"></h3>

<div class="answers" id="answers"></div>

<div id="correctText"></div>

</div>

<div id="result"></div>

<canvas id="chart"></canvas>

</div>

<audio id="correctSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5b0f4d2c03.mp3"></audio>
<audio id="wrongSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0d30a3c0d2.mp3"></audio>

<script>

let studentName=""
let studentClass=""

let questions=[

["Cấu trúc rẽ nhánh dùng để làm gì?",["Lựa chọn hành động theo điều kiện","Lặp lại lệnh","Xóa lệnh","Tạo âm thanh"],0],
["Câu lệnh nào mô tả cấu trúc rẽ nhánh?",["Nếu…thì","Lặp lại","Di chuyển","Âm thanh"],0],
["Cấu trúc 'Nếu…thì…nếu không thì' dùng để?",["Xử lý hai trường hợp","Lặp lại","Xóa lệnh","Tạo biến"],0],
["Ví dụ rẽ nhánh trong đời sống?",["Nếu trời mưa thì mang áo mưa","Nghe nhạc","Xem phim","Đọc sách"],0],
["Cấu trúc rẽ nhánh thường dùng trong?",["Lập trình","Âm nhạc","Vẽ tranh","Soạn thảo"],0],

["Trong Scratch, rẽ nhánh dùng khối nào?",["If","Repeat","Move","Say"],0],
["Rẽ nhánh giúp chương trình?",["Quyết định hành động","Chơi nhạc","Xóa dữ liệu","Tắt máy"],0],
["Nếu điều kiện đúng thì?",["Thực hiện lệnh","Dừng","Xóa","Lặp"],0],
["Nếu điều kiện sai thì?",["Không thực hiện lệnh","Chạy","Lặp","In"],0],
["Cấu trúc rẽ nhánh phụ thuộc vào?",["Điều kiện","Âm thanh","Hình ảnh","Màu sắc"],0],

["Trong ví dụ vé xem phim, điều kiện là?",["Đi xem một mình hay theo nhóm","Nghe nhạc","Chơi game","Đọc sách"],0],
["Nếu đi xem một mình thì giá vé?",["60 000","40 000","30 000","20 000"],0],
["Nếu đi xem theo nhóm thì giá vé?",["40 000","60 000","80 000","100 000"],0],
["Cấu trúc rẽ nhánh giúp chương trình?",["Chọn một trong nhiều hành động","Lặp mãi","Dừng","Tắt"],0],
["Cấu trúc rẽ nhánh xuất hiện trong?",["Scratch","Paint","Word","Excel"],0],

["Rẽ nhánh giúp kiểm tra?",["Điều kiện","Âm thanh","Hình ảnh","Chuột"],0],
["Nếu điều kiện đúng chương trình?",["Thực hiện lệnh","Xóa","Tắt","Ngủ"],0],
["Nếu điều kiện sai?",["Bỏ qua lệnh","Lặp","Chạy","In"],0],
["Cấu trúc rẽ nhánh thuộc loại?",["Cấu trúc điều khiển","Cấu trúc dữ liệu","Âm thanh","Hình ảnh"],0],
["Cấu trúc rẽ nhánh dùng trong?",["Chương trình","Âm nhạc","Phim","Tranh"],0],

["Trong Scratch rẽ nhánh có dạng?",["If","Repeat","Move","Sound"],0],
["Điều kiện trong rẽ nhánh có thể là?",["So sánh","Âm thanh","Màu","Hình"],0],
["Nếu a>b thì?",["Điều kiện đúng","Sai","Không biết","Không"],0],
["Nếu a<b thì?",["Điều kiện đúng","Sai","Không biết","Không"],0],
["Nếu a=b thì?",["Điều kiện đúng","Sai","Không biết","Không"],0],

["Rẽ nhánh giúp chương trình?",["Linh hoạt","Cứng nhắc","Không đổi","Sai"],0],
["Rẽ nhánh kiểm tra?",["Điều kiện","Âm thanh","Chuột","Bàn phím"],0],
["Rẽ nhánh dùng trong?",["Lập trình Scratch","Paint","Word","Excel"],0],
["Nếu điều kiện đúng chương trình?",["Chạy lệnh","Dừng","Xóa","In"],0],
["Nếu sai?",["Không chạy lệnh","Lặp","Xóa","In"],0],

["Rẽ nhánh giúp chương trình thông minh hơn?",["Có","Không","Không biết","Hiếm khi"],0],
["Rẽ nhánh có thể dùng nhiều lần?",["Có","Không","Không biết","Hiếm khi"],0],
["Scratch hỗ trợ rẽ nhánh?",["Có","Không","Không biết","Hiếm khi"],0],
["Rẽ nhánh cần điều kiện?",["Có","Không","Không biết","Hiếm khi"],0],
["Điều kiện giúp?",["Quyết định hành động","Chơi game","Nghe nhạc","Không"],0],

["Nếu trời mưa thì?",["Mang áo mưa","Nghe nhạc","Xem phim","Đọc sách"],0],
["Nếu trời nắng thì?",["Đội mũ","Nghe nhạc","Chơi game","Xem phim"],0],
["Rẽ nhánh có bao nhiêu kết quả?",["Hai hoặc nhiều","Một","Không","Sai"],0],
["Rẽ nhánh dùng để?",["Chọn hành động","Lặp","Xóa","Tắt"],0],
["Rẽ nhánh kiểm tra điều kiện?",["Đúng","Sai","Không","Không biết"],0],

["Rẽ nhánh thuộc kiến thức?",["Lập trình","Âm nhạc","Mỹ thuật","Thể dục"],0],
["Rẽ nhánh dùng trong Scratch?",["Có","Không","Không biết","Hiếm khi"],0],
["Rẽ nhánh giúp chương trình?",["Quyết định","Ngủ","Dừng","Xóa"],0],
["Rẽ nhánh phụ thuộc?",["Điều kiện","Màu","Âm thanh","Chuột"],0],
["Rẽ nhánh giúp chọn?",["Hành động","Âm nhạc","Video","Game"],0],

["Rẽ nhánh có trong bài nào?",["Bài 10","Bài 1","Bài 2","Bài 3"],0]

];

questions.sort(()=>Math.random()-0.5)

let current=0
let correctCount=0
let wrongCount=0
let totalTime=1800
let timer

function start(){

studentName=document.getElementById("name").value.trim()
studentClass=document.getElementById("class").value.trim()

if(studentName==""||studentClass==""){
alert("Nhập tên và lớp")
return
}

quiz.style.display="block"

startTimer()

load()

}

function startTimer(){

timer=setInterval(()=>{

totalTime--

let m=Math.floor(totalTime/60)
let s=totalTime%60

time.innerText=
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0')

if(totalTime<=0){
finish()
}

},1000)

}

function load(){

correctText.innerText=""

progress.style.width=(current/questions.length*100)+"%"

question.innerText="Câu "+(current+1)+": "+questions[current][0]

let ans=questions[current][1]
.map((a,i)=>({t:a,i}))
.sort(()=>Math.random()-0.5)

answers.innerHTML=""

ans.forEach((a,k)=>{

answers.innerHTML+=
`<div class="answer a${k}" onclick="choose(${a.i})">${a.t}</div>`

})

}

function choose(i){

let correct=questions[current][2]
let correctAns=questions[current][1][correct]

document.querySelectorAll(".answer").forEach(el=>{

if(el.innerText===correctAns)
el.classList.add("correct")
else
el.classList.add("wrong")

})

if(i===correct){
correctCount++
correctSound.play()
}else{
wrongCount++
wrongSound.play()
}

correctText.innerText="Đáp án đúng: "+correctAns

setTimeout(()=>{

current++

if(current<questions.length){
load()
}else{
finish()
}

},1200)

}

function finish(){

clearInterval(timer)

quiz.style.display="none"

let total=questions.length
let percent=Math.round(correctCount/total*100)

let grade=""

if(percent>=80) grade="Giỏi"
else if(percent>=65) grade="Khá"
else if(percent>=50) grade="Trung bình"
else grade="Cần cố gắng"

result.innerHTML=

"<h2>Hoàn thành bài</h2>"+
"<p>Học sinh: "+studentName+"</p>"+
"<p>Lớp: "+studentClass+"</p>"+
"<h3>Đúng: "+correctCount+"</h3>"+
"<h3>Sai: "+wrongCount+"</h3>"+
"<h3>Tỷ lệ: "+percent+"%</h3>"+
"<h3>Xếp loại: "+grade+"</h3>"+
"<br><button onclick='location.reload()'>Làm lại bài</button>"

drawChart()

}

function drawChart(){

let c=document.getElementById("chart")
let ctx=c.getContext("2d")

let total=correctCount+wrongCount

let correctAngle=(correctCount/total)*2*Math.PI

ctx.clearRect(0,0,300,300)

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,0,correctAngle)
ctx.fillStyle="#2ecc71"
ctx.fill()

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,correctAngle,2*Math.PI)
ctx.fillStyle="#e74c3c"
ctx.fill()

}

</script>

</body>
</html>
