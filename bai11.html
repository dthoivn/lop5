<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quiz Classroom PRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#eef4ff;
margin:0;
text-align:center
}

.card{
max-width:900px;
margin:auto;
margin-top:20px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15)
}

input{
padding:10px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
width:220px
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px
}

.answer{
padding:18px;
border-radius:12px;
font-size:18px;
cursor:pointer;
transition:.25s;
font-weight:bold
}

.answer:hover{
transform:scale(1.05)
}

.a0{background:#ff7675}
.a1{background:#74b9ff}
.a2{background:#ffeaa7}
.a3{background:#55efc4}

.correct{
background:#2ecc71!important;
transform:scale(1.15)
}

.wrong{
opacity:.3
}

.timer{
font-size:24px;
color:#e74c3c;
font-weight:bold
}

#progressBar{
width:100%;
height:12px;
background:#ddd;
border-radius:10px;
margin-top:15px;
overflow:hidden
}

#progress{
height:100%;
width:0%;
background:#2ecc71
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:10px;
background:#0984e3;
color:white;
cursor:pointer
}

button:hover{
background:#0652dd
}

canvas{
max-width:300px;
margin-top:20px
}

/* mobile */

@media(max-width:600px){

.answers{
grid-template-columns:1fr
}

.answer{
font-size:16px
}

}

</style>
</head>

<body>

<div class="card">

<h2>Quiz Tin học 5 - Bài 11 - Cấu trúc lặp</h2>

<input id="name" placeholder="Họ tên học sinh">
<br><br>

<input id="class" placeholder="Lớp">
<br><br>

<button onclick="start()">BẮT ĐẦU</button>

<div id="quiz" style="display:none">

<div class="timer" id="time">30:00</div>

<div id="progressBar">
<div id="progress"></div>
</div>

<h3 id="question"></h3>

<div class="answers" id="answers"></div>

<div id="correctText"></div>

</div>

<div id="result"></div>

<canvas id="chart"></canvas>

</div>

<audio id="correctSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5b0f4d2c03.mp3"></audio>
<audio id="wrongSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0d30a3c0d2.mp3"></audio>

<script>

let studentName=""
let studentClass=""

let questions=[

["Cấu trúc lặp dùng để làm gì?",["Lặp lại các thao tác nhiều lần","Xóa chương trình","Tắt máy tính","Đổi tên tệp"],0],
["Trong lập trình, lặp nghĩa là gì?",["Thực hiện lại một hành động","Xóa dữ liệu","Lưu dữ liệu","Chia dữ liệu"],0],
["Cấu trúc lặp giúp gì cho chương trình?",["Giảm số lệnh phải viết","Tăng dung lượng","Xóa chương trình","Tắt máy"],0],
["Có mấy loại cấu trúc lặp cơ bản?",["2","3","4","5"],0],
["Hai loại cấu trúc lặp là gì?",["Biết trước và không biết trước số lần","Lặp nhanh và chậm","Lặp lớn và nhỏ","Lặp màu và trắng"],0],
["Lặp với số lần biết trước nghĩa là gì?",["Biết trước số lần thực hiện","Không biết số lần","Không lặp","Chỉ chạy 1 lần"],0],
["Lặp với số lần không biết trước nghĩa là gì?",["Chỉ dừng khi có điều kiện","Biết trước số lần","Chạy 1 lần","Không chạy"],0],
["Trong Scratch, lệnh repeat dùng để làm gì?",["Lặp số lần xác định","Dừng chương trình","Xóa nhân vật","Đổi màu"],0],
["Trong Scratch, lệnh forever dùng để làm gì?",["Lặp mãi mãi","Chạy một lần","Xóa chương trình","Dừng máy"],0],
["Lệnh repeat until dùng để làm gì?",["Lặp đến khi điều kiện đúng","Lặp vô hạn","Chạy 1 lần","Xóa lệnh"],0],

["Ví dụ lặp 4 lần di chuyển là loại lặp gì?",["Lặp biết trước","Lặp không biết trước","Không phải lặp","Lặp ngẫu nhiên"],0],
["Ví dụ lặp đến khi nhấn phím Q là loại lặp gì?",["Lặp không biết trước","Lặp biết trước","Không lặp","Lặp cố định"],0],
["Trong Scratch, khối lệnh lặp có dạng gì?",["Khối bao quanh các lệnh","Khối âm thanh","Khối màu","Khối chuyển động"],0],
["Lệnh repeat trong Scratch có hình dạng gì?",["Khối hình chữ C","Khối tròn","Khối tam giác","Khối vuông"],0],
["Khối lệnh lặp thường chứa gì?",["Các lệnh cần lặp lại","Hình ảnh","Âm thanh","Video"],0],
["Scratch là gì?",["Ngôn ngữ lập trình trực quan","Phần mềm vẽ","Trình duyệt web","Game"],0],
["Nhân vật trong Scratch gọi là gì?",["Sprite","Actor","Player","Robot"],0],
["Nơi nhân vật hoạt động trong Scratch gọi là gì?",["Sân khấu","Bàn phím","Màn hình","Chuột"],0],
["Lệnh wait 1 seconds dùng để làm gì?",["Chờ 1 giây","Chạy nhanh","Tắt chương trình","Xóa lệnh"],0],
["Lệnh move 100 steps dùng để làm gì?",["Di chuyển 100 bước","Xóa nhân vật","Đổi màu","Phát nhạc"],0],

["Lệnh turn 90 degrees dùng để làm gì?",["Xoay 90 độ","Di chuyển","Phóng to","Thu nhỏ"],0],
["Lặp giúp chương trình như thế nào?",["Ngắn gọn hơn","Dài hơn","Phức tạp hơn","Chậm hơn"],0],
["Nếu không dùng lặp thì sao?",["Phải viết nhiều lệnh giống nhau","Không chạy được","Máy hỏng","Mất điện"],0],
["Khối forever sẽ dừng khi nào?",["Khi chương trình dừng","Sau 1 lần","Sau 2 lần","Không bao giờ"],0],
["Lệnh repeat 5 nghĩa là gì?",["Lặp 5 lần","Lặp 1 lần","Lặp vô hạn","Không lặp"],0],
["Trong Scratch có thể lặp bao nhiêu lần?",["Bao nhiêu cũng được","Chỉ 5","Chỉ 10","Chỉ 100"],0],
["Cấu trúc lặp thường dùng khi nào?",["Khi hành động lặp lại","Khi tắt máy","Khi xóa tệp","Khi mở game"],0],
["Ví dụ lặp trong đời sống là gì?",["Đánh răng mỗi ngày","Xóa máy","Cài game","Xem phim"],0],
["Đi bộ 10 bước 5 lần là gì?",["Một dạng lặp","Không phải lặp","Một trò chơi","Một video"],0],
["Chạy vòng quanh sân nhiều lần là gì?",["Lặp","Không lặp","Một trò chơi","Một chương trình"],0],

["Khối repeat until dừng khi nào?",["Khi điều kiện đúng","Khi chương trình bắt đầu","Khi mở máy","Khi tắt mạng"],0],
["Nếu điều kiện chưa đúng thì sao?",["Tiếp tục lặp","Dừng","Xóa","Đổi màu"],0],
["Trong Scratch có thể đặt lệnh gì trong khối lặp?",["Nhiều lệnh","Không lệnh","Chỉ 1 lệnh","Chỉ âm thanh"],0],
["Khối lệnh lặp giúp điều gì?",["Tiết kiệm thời gian viết lệnh","Xóa dữ liệu","Làm máy chậm","Giảm RAM"],0],
["Lệnh lặp có thể chứa lệnh di chuyển không?",["Có","Không","Chỉ âm thanh","Chỉ hình ảnh"],0],
["Lệnh lặp có thể chứa lệnh xoay không?",["Có","Không","Chỉ hình ảnh","Chỉ màu"],0],
["Lệnh lặp có thể chứa lệnh chờ không?",["Có","Không","Chỉ di chuyển","Chỉ âm thanh"],0],
["Cấu trúc lặp thuộc phần nào của lập trình?",["Điều khiển chương trình","Âm thanh","Hình ảnh","Màu sắc"],0],
["Trong Scratch lệnh repeat nằm ở nhóm nào?",["Control","Motion","Sound","Looks"],0],
["Nhóm Control trong Scratch dùng để làm gì?",["Điều khiển chương trình","Vẽ hình","Phát nhạc","Đổi màu"],0],

["Nếu repeat 3 thì hành động xảy ra bao nhiêu lần?",["3","2","1","4"],0],
["Nếu repeat 10 thì lặp bao nhiêu lần?",["10","9","1","20"],0],
["Forever có nghĩa là gì?",["Mãi mãi","Một lần","Hai lần","Ba lần"],0],
["Repeat until có nghĩa là gì?",["Lặp đến khi","Lặp mãi","Lặp 1 lần","Không lặp"],0],
["Lặp giúp chương trình hoạt động như thế nào?",["Tự động","Thủ công","Ngẫu nhiên","Không chạy"],0],
["Trong Scratch có thể kết hợp lặp với gì?",["Các lệnh khác","Chỉ âm thanh","Chỉ hình ảnh","Chỉ màu"],0],
["Cấu trúc lặp thường có dạng gì?",["Khối bao lệnh","Khối rời","Khối tròn","Khối tam giác"],0],
["Lặp giúp tạo hoạt động nào?",["Chuyển động liên tục","Ảnh tĩnh","Văn bản","Hình vẽ"],0],
["Ví dụ nhân vật xoay liên tục là gì?",["Dùng lệnh lặp","Không dùng lặp","Dùng ảnh","Dùng âm thanh"],0],
["Cấu trúc lặp là kiến thức thuộc bài nào?",["Bài 11 Tin học 5","Bài 1","Bài 3","Bài 5"],0]

];

questions.sort(()=>Math.random()-0.5)

let current=0
let correctCount=0
let wrongCount=0
let totalTime=1800
let timer

function start(){

studentName=document.getElementById("name").value.trim()
studentClass=document.getElementById("class").value.trim()

if(studentName==""||studentClass==""){
alert("Nhập tên và lớp")
return
}

quiz.style.display="block"

startTimer()

load()

}

function startTimer(){

timer=setInterval(()=>{

totalTime--

let m=Math.floor(totalTime/60)
let s=totalTime%60

time.innerText=
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0')

if(totalTime<=0){
finish()
}

},1000)

}

function load(){

correctText.innerText=""

progress.style.width=(current/questions.length*100)+"%"

question.innerText="Câu "+(current+1)+": "+questions[current][0]

let ans=questions[current][1]
.map((a,i)=>({t:a,i}))
.sort(()=>Math.random()-0.5)

answers.innerHTML=""

ans.forEach((a,k)=>{

answers.innerHTML+=
`<div class="answer a${k}" onclick="choose(${a.i})">${a.t}</div>`

})

}

function choose(i){

let correct=questions[current][2]
let correctAns=questions[current][1][correct]

document.querySelectorAll(".answer").forEach(el=>{

if(el.innerText===correctAns)
el.classList.add("correct")
else
el.classList.add("wrong")

})

if(i===correct){
correctCount++
correctSound.play()
}else{
wrongCount++
wrongSound.play()
}

correctText.innerText="Đáp án đúng: "+correctAns

setTimeout(()=>{

current++

if(current<questions.length){
load()
}else{
finish()
}

},1200)

}

function finish(){

clearInterval(timer)

quiz.style.display="none"

let total=questions.length
let percent=Math.round(correctCount/total*100)

let grade=""

if(percent>=80) grade="Giỏi"
else if(percent>=65) grade="Khá"
else if(percent>=50) grade="Trung bình"
else grade="Cần cố gắng"

result.innerHTML=

"<h2>Hoàn thành bài</h2>"+
"<p>Học sinh: "+studentName+"</p>"+
"<p>Lớp: "+studentClass+"</p>"+
"<h3>Đúng: "+correctCount+"</h3>"+
"<h3>Sai: "+wrongCount+"</h3>"+
"<h3>Tỷ lệ: "+percent+"%</h3>"+
"<h3>Xếp loại: "+grade+"</h3>"+
"<br><button onclick='location.reload()'>Làm lại bài</button>"

drawChart()

}

function drawChart(){

let c=document.getElementById("chart")
let ctx=c.getContext("2d")

let total=correctCount+wrongCount

let correctAngle=(correctCount/total)*2*Math.PI

ctx.clearRect(0,0,300,300)

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,0,correctAngle)
ctx.fillStyle="#2ecc71"
ctx.fill()

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,correctAngle,2*Math.PI)
ctx.fillStyle="#e74c3c"
ctx.fill()

}

</script>

</body>
</html>
