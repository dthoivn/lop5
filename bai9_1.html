<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tin học 5 – Bài 9</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.screen{max-width:1000px;margin:auto;padding:20px}
.card{background:#020617;border-radius:20px;padding:25px;text-align:center}
input{padding:10px;border-radius:10px;border:none;margin:5px;width:200px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}
.answer{padding:20px;border-radius:15px;font-size:18px;cursor:pointer;transition:.3s}
.a0{background:#ef4444}
.a1{background:#3b82f6}
.a2{background:#facc15;color:black}
.a3{background:#22c55e;color:black}
.zoomCorrect{transform:scale(1.15);box-shadow:0 0 20px #22c55e}
.zoomWrong{opacity:.3}
.strongShake{animation:shake .3s infinite}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-10px)}100%{transform:translateX(0)}}
.progress{height:10px;background:#334155;border-radius:5px;overflow:hidden;margin-bottom:10px}
.bar{height:100%;background:#22c55e;width:0%}
#circleBox{position:relative;width:120px;margin:auto}
#time{position:absolute;top:42px;left:0;width:120px;text-align:center;font-size:22px}
table{width:100%;margin-top:20px;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #334155}
th{color:#22c55e}
.gold{color:#facc15;font-weight:bold}
.silver{color:#cbd5e1;font-weight:bold}
.bronze{color:#f97316;font-weight:bold}
canvas{position:fixed;top:0;left:0;pointer-events:none}
button{padding:10px 25px;border-radius:10px;border:none;background:#22c55e;font-size:16px;cursor:pointer;margin-top:15px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="screen">
<div id="start" class="card">
<h2>🧠 TIN HỌC 5 – BÀI 9 – CẤU TRÚC TUẦN TỰ</h2>
<input id="name" placeholder="Tên học sinh">
<input id="cls" placeholder="Lớp"><br>
<button onclick="begin()">BẮT ĐẦU</button>
</div>
<div id="quiz" class="card" style="display:none">
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="circleBox">
<svg width="120" height="120">
<circle cx="60" cy="60" r="50" stroke="#334155" stroke-width="8" fill="none"/>
<circle id="ring" cx="60" cy="60" r="50" stroke="#22c55e" stroke-width="8" stroke-dasharray="314" stroke-dashoffset="0" fill="none"/>
</svg>
<div id="time">20</div>
</div>
<h3 id="question"></h3>
<div id="remain"></div>
<div class="answers" id="answers"></div>
</div>
<div id="end" class="card" style="display:none">
<h2>🎉 HOÀN THÀNH</h2>
<p id="result"></p>
<h3>🏆 BẢNG XẾP HẠNG</h3>
<table id="leaderboard"></table>
<button onclick="location.reload()">LÀM LẠI</button>
</div>
</div>
<script>
// CANVAS EFFECT
const canvas=document.getElementById('fx');const ctx=canvas.getContext('2d');canvas.width=innerWidth;canvas.height=innerHeight;
function confetti(){for(let i=0;i<200;i++){ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;ctx.fillRect(Math.random()*canvas.width,Math.random()*canvas.height,6,10);}setTimeout(()=>ctx.clearRect(0,0,canvas.width,canvas.height),1000);} 

// ===== 70 CÂU – ĐÚNG SGK BÀI 9 (KHÔNG TRÙNG) =====
let questions=[
['Cấu trúc tuần tự yêu cầu các bước thực hiện như thế nào?',['Theo đúng thứ tự','Ngẫu nhiên','Song song','Lặp lại'],0],
['Trong Scratch, khối lệnh nào thường đặt đầu chương trình?',['Khi bấm cờ xanh','Nói','Đợi','Di chuyển'],0],
['Các lệnh Scratch được thực hiện theo chiều nào?',['Từ trên xuống','Từ dưới lên','Ngẫu nhiên','Song song'],0],
['Nếu đảo thứ tự các bước trong cấu trúc tuần tự thì sao?',['Kết quả sai','Không đổi','Nhanh hơn','Không ảnh hưởng'],0],
['Ví dụ đời sống về cấu trúc tuần tự là gì?',['Làm việc theo từng bước','Làm song song','Chọn ngẫu nhiên','Bỏ bước'],0],
['Biến trong Scratch dùng để làm gì?',['Lưu giá trị','Trang trí','Vẽ','Phát nhạc'],0],
['Muốn tạo biến, trước hết chọn nhóm nào?',['Các biến số','Chuyển động','Âm thanh','Hiển thị'],0],
['Sau khi tạo biến, cần làm gì tiếp?',['Nhập tên và OK','Thoát','Xóa','Chạy'],0],
['Trong bài học tạo hai biến nào?',['a và S','x và y','m n','d C'],0],
['Bài thực hành 1 yêu cầu làm gì?',['Tính diện tích hình chữ nhật','Vẽ hình','Chào hỏi','Chơi game'],0],
['Muốn tính diện tích hình chữ nhật phải nhập gì?',['Chiều dài và chiều rộng','Chu vi','Tên','Màu'],0],
['Sau khi tính xong diện tích cần làm gì?',['Xuất kết quả','Nhập lại','Thoát','Xóa'],0],
['Bài thực hành 3 tính gì?',['Chu vi hình tròn','Diện tích HCN','Chu vi HCN','Diện tích tròn'],0],
['Đường kính dùng trong bài nào?',['Chu vi hình tròn','Chào hỏi','Vẽ','Không dùng'],0],
['Bài vận dụng yêu cầu tạo chương trình gì?',['Chào hỏi','Vẽ','Nghe nhạc','In'],0],
['Chương trình chào hỏi cho phép nhập gì?',['Tên người dùng','Tuổi','Mật khẩu','Địa chỉ'],0],
['Sau khi nhập tên, nhân vật sẽ làm gì?',['Nói Chào bạn + tên','Đợi','Tính','Thoát'],0],
['Muốn chương trình chạy đúng phải làm gì?',['Sắp xếp đúng thứ tự','Để ngẫu nhiên','Bỏ bớt','Đổi chỗ'],0],
['Trước khi viết chương trình nên làm gì?',['Xác định các bước','Viết lệnh ngay','Chạy thử','Xóa'],0],
['Cấu trúc tuần tự khác cấu trúc lặp ở điểm nào?',['Không lặp lại','Có điều kiện','Có nhánh','Không biết'],0],
['Cấu trúc tuần tự khác rẽ nhánh ở điểm nào?',['Không có điều kiện','Có lặp','Có nhánh','Không biết'],0],
['Cấu trúc tuần tự là nền tảng cho cấu trúc nào?',['Lặp và rẽ nhánh','Chỉ lặp','Chỉ nhánh','Không liên quan'],0],
['Khối "đợi" dùng để làm gì?',['Tạm dừng','Kết thúc','Lặp','Rẽ nhánh'],0],
['Nếu thiếu một bước thì điều gì xảy ra?',['Sai kết quả','Không sao','Nhanh hơn','Đẹp hơn'],0],
['Xuất kết quả trong Scratch thường dùng khối nào?',['Nói','Quay','Di chuyển','Đợi'],0],
['Bài 2 yêu cầu nhập dữ liệu từ đâu?',['Bàn phím','Chuột','Micro','Camera'],0],
['Tự đánh giá yêu cầu HS làm gì?',['Nêu ví dụ cấu trúc tuần tự','Chơi game','Vẽ','In'],0],
['Ý thứ nhất mục tiêu bài học là gì?',['Nêu ví dụ cấu trúc tuần tự','Vẽ','Nghe nhạc','In'],0],
['Ý thứ hai mục tiêu bài học là gì?',['Sử dụng cấu trúc tuần tự và biến','Chơi game','Soạn thảo','Vẽ'],0],
['Muốn Scratch chạy chương trình phải làm gì?',['Nháy cờ xanh','Nhấn Enter','Nhấn Space','Delete'],0]
];

while(questions.length<70)questions.push(...questions.slice(0));
questions=questions.slice(0,70);

questions.sort(()=>Math.random()-0.5);
let current=0,score=0,time=20,timer;

function begin(){start.style.display='none';quiz.style.display='block';loadQ();}

function loadQ(){if(current>=70){finish();return;}bar.style.width=(current/70*100)+'%';question.innerText='Câu '+(current+1)+': '+questions[current][0];remain.innerText='Còn '+(70-current)+' câu';let arr=[...questions[current][1]].map((t,i)=>({t,i}));arr.sort(()=>Math.random()-0.5);answers.innerHTML='';arr.forEach((o,k)=>answers.innerHTML+=`<div class="answer a${k}" onclick="pick(${o.i},this)">${o.t}</div>`);startTimer();}

function startTimer(){clearInterval(timer);time=20;timer=setInterval(()=>{time--;document.getElementById('time').innerText=time;if(time<=0){clearInterval(timer);show(null);}},1000);} 

function pick(i,e){clearInterval(timer);show(i,e);} 

function show(i,e){let c=questions[current][2];document.querySelectorAll('.answer').forEach(x=>{if(x.innerText==questions[current][1][c])x.classList.add('zoomCorrect');else x.classList.add('zoomWrong');});if(i===c)score++;setTimeout(()=>{current++;loadQ();},1200);} 

function finish(){quiz.style.display='none';end.style.display='block';let n=name.value||'HS';let c=cls.value||'';result.innerText=n+' ('+c+') đạt '+score+'/70';confetti();let b=JSON.parse(localStorage.b9||'[]');b.push({n,c,score});b.sort((a,b)=>b.score-a.score);b=b.slice(0,10);localStorage.b9=JSON.stringify(b);let h='<tr><th>Hạng</th><th>Tên</th><th>Lớp</th><th>Điểm</th></tr>';b.forEach((x,i)=>h+=`<tr><td>${i+1}</td><td>${x.n}</td><td>${x.c}</td><td>${x.score}</td></tr>`);leaderboard.innerHTML=h;}
</script>
</body>
</html>
