<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>🎮 Game kiểm tra – Cấu trúc tuần tự (Tin học 5 – Bài 9)</title>
<style>
body{margin:0;font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#74b9ff,#81ecec)}
#app{max-width:1200px;margin:20px auto;background:#fff;border-radius:18px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{text-align:center}
#top{display:flex;align-items:center;gap:10px}
#timer{font-weight:bold;color:#d63031}
#progress{flex:1;height:12px;background:#eee;border-radius:10px;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,#ffeaa7,#00b894)}
.question{font-size:20px;margin:20px 0}
.answers button{width:100%;margin:8px 0;padding:10px;border:none;border-radius:12px;background:#f1f2f6;cursor:pointer}
.answers button:hover{background:#dff9fb}
.correct{background:#c8e6c9!important}
.wrong{background:#ffcdd2!important}
#next{display:none;margin:15px auto;padding:10px 40px;border:none;border-radius:20px;background:#0984e3;color:#fff}
#result,#report{display:none}
#report table{width:100%;border-collapse:collapse}
#report th,#report td{border:1px solid #ccc;padding:6px;text-align:center}
</style>
</head>
<body>
<div id="app">
<h1>🎮 GAME KIỂM TRA – CẤU TRÚC TUẦN TỰ (TIN HỌC 5 – BÀI 9)</h1>
<div id="top"><div id="timer">15:00</div><div id="progress"><div id="bar"></div></div></div>
<div id="quiz"><div class="question" id="q"></div><div class="answers" id="a"></div></div>
<button id="next">Câu tiếp ▶</button>
<div id="result"></div><div id="report"></div>
</div>
<script>
// 70 câu – chỉ dựa nội dung trong Bài 9
const questions=[
{q:"Trong cấu trúc tuần tự, các bước có được đổi chỗ cho nhau không?",a:["Không","Có","Tuỳ ý","Không biết"],c:0},
{q:"Cấu trúc tuần tự yêu cầu các bước thực hiện như thế nào?",a:["Theo đúng thứ tự","Ngẫu nhiên","Song song","Lặp lại"],c:0},
{q:"Ví dụ tính diện tích hình chữ nhật cần làm bước nào trước?",a:["Nhập chiều dài, chiều rộng","Xuất kết quả","Kết thúc","Tính ngay"],c:0},
{q:"Sau khi nhập chiều dài và chiều rộng, bước tiếp theo là gì?",a:["Tính diện tích","Xuất kết quả","Kết thúc","Nhập lại"],c:0},
{q:"Sau khi tính xong diện tích, cần làm gì?",a:["Xuất kết quả","Nhập lại","Kết thúc ngay","Xóa"],c:0},

{q:"Phần ghi nhớ nhấn mạnh điều gì về cấu trúc tuần tự?",a:["Thứ tự rất quan trọng","Không cần đúng thứ tự","Có thể bỏ bước","Làm tùy ý"],c:0},
{q:"Trong Scratch, lệnh nào thường đặt đầu chương trình?",a:["Khi bấm cờ xanh","Nói","Đợi","Di chuyển"],c:0},
{q:"Khi nháy cờ xanh, Scratch sẽ làm gì?",a:["Chạy chương trình","Dừng","Thoát","Xóa"],c:0},
{q:"Các khối lệnh Scratch được thực hiện theo chiều nào?",a:["Từ trên xuống","Từ dưới lên","Ngẫu nhiên","Song song"],c:0},
{q:"Sắp xếp lệnh đúng thứ tự thể hiện cấu trúc gì?",a:["Tuần tự","Lặp","Rẽ nhánh","Không cấu trúc"],c:0},

{q:"Nếu đảo thứ tự các lệnh Scratch thì điều gì có thể xảy ra?",a:["Sai kết quả","Không đổi","Chạy nhanh","Không ảnh hưởng"],c:0},
{q:"Chương trình Scratch nối các lệnh liên tiếp là chương trình gì?",a:["Có cấu trúc tuần tự","Có cấu trúc lặp","Có rẽ nhánh","Không cấu trúc"],c:0},
{q:"Cấu trúc tuần tự trong Scratch giúp chương trình thế nào?",a:["Chạy đúng logic","Đẹp hơn","Ít lệnh","Nhanh hơn"],c:0},
{q:"Khi thiếu một bước trong cấu trúc tuần tự thì sao?",a:["Kết quả sai","Không sao","Đẹp hơn","Nhanh hơn"],c:0},
{q:"Ví dụ đời sống về cấu trúc tuần tự là gì?",a:["Làm việc theo từng bước","Làm nhiều việc cùng lúc","Chọn ngẫu nhiên","Bỏ qua bước"],c:0},

{q:"Biến trong Scratch dùng để làm gì?",a:["Lưu giá trị","Trang trí","Vẽ","Phát nhạc"],c:0},
{q:"Muốn tạo biến, trước tiên chọn nhóm lệnh nào?",a:["Các biến số","Chuyển động","Âm thanh","Hiển thị"],c:0},
{q:"Sau khi chọn Các biến số, em làm gì tiếp?",a:["Chọn Tạo một biến","Chạy chương trình","Thoát","Xóa"],c:0},
{q:"Sau khi gõ tên biến, cần làm gì?",a:["Chọn OK","Nhấn Delete","Thoát","Bỏ qua"],c:0},
{q:"Trong bài học, tạo hai biến nào?",a:["a và S","x và y","m và n","d và C"],c:0},

{q:"Trong bài thực hành, chương trình tính diện tích cần nhập gì từ bàn phím?",a:["Chiều dài và chiều rộng","Chu vi","Tên","Màu"],c:0},
{q:"Bài thực hành 3 yêu cầu tính gì?",a:["Chu vi hình tròn","Diện tích hình chữ nhật","Chu vi hình chữ nhật","Diện tích hình tròn"],c:0},
{q:"Đường kính d dùng trong bài nào?",a:["Tính chu vi hình tròn","Tính diện tích sân","Chào hỏi","Không dùng"],c:0},
{q:"Bài vận dụng yêu cầu tạo chương trình gì?",a:["Chào hỏi","Tính toán","Vẽ hình","Chơi game"],c:0},
{q:"Chương trình chào hỏi cho phép nhập gì?",a:["Tên người dùng","Tuổi","Địa chỉ","Mật khẩu"],c:0},

{q:"Sau khi nhập tên, nhân vật Scratch sẽ làm gì?",a:["Nói Chào bạn + tên","Tính toán","Đợi","Thoát"],c:0},
{q:"Ví dụ nhập tên Lan, mèo Scratch nói gì?",a:["Chào bạn Lan","Xin chào","Hello","Lan"],c:0},
{q:"Muốn chương trình chạy đúng, cần làm gì với các bước?",a:["Sắp xếp đúng thứ tự","Để ngẫu nhiên","Bỏ bớt","Đổi chỗ"],c:0},
{q:"Cấu trúc tuần tự thường dùng cho bài toán như thế nào?",a:["Các bước rõ ràng","Có nhiều điều kiện","Lặp nhiều","Song song"],c:0},
{q:"Trước khi viết chương trình, nên làm gì?",a:["Xác định các bước","Viết lệnh ngay","Chạy thử","Xóa"],c:0},

{q:"Đánh số thứ tự các bước giúp điều gì?",a:["Không nhầm lẫn","Đẹp hơn","Nhanh hơn","Ít lệnh"],c:0},
{q:"Trong cấu trúc tuần tự, bước tính toán phải đứng sau bước nào?",a:["Nhập dữ liệu","Xuất kết quả","Kết thúc","Không quan trọng"],c:0},
{q:"Xuất kết quả trong Scratch thường dùng khối nào?",a:["Nói","Đợi","Quay","Di chuyển"],c:0},
{q:"Nếu chưa nhập dữ liệu mà đã tính thì sao?",a:["Sai kết quả","Đúng","Không đổi","Không chạy"],c:0},
{q:"Cấu trúc tuần tự có thể áp dụng trong học tập không?",a:["Có","Không","Chỉ Scratch","Không biết"],c:0},

{q:"Cấu trúc tuần tự khác cấu trúc lặp ở điểm nào?",a:["Không lặp lại","Có lặp","Có điều kiện","Không biết"],c:0},
{q:"Cấu trúc tuần tự khác rẽ nhánh ở điểm nào?",a:["Không có điều kiện","Có điều kiện","Có lặp","Không biết"],c:0},
{q:"Cấu trúc tuần tự là nền tảng cho cấu trúc nào?",a:["Lặp và rẽ nhánh","Chỉ lặp","Chỉ rẽ nhánh","Không liên quan"],c:0},
{q:"Trong Scratch, lệnh trên cùng chạy trước hay sau?",a:["Trước","Sau","Cùng lúc","Ngẫu nhiên"],c:0},
{q:"Khối 'đợi' trong cấu trúc tuần tự dùng để làm gì?",a:["Tạm dừng","Kết thúc","Lặp","Rẽ nhánh"],c:0},

{q:"Khi tạo biến, nếu chưa chọn nhóm Các biến số thì có tạo được không?",a:["Không","Có","Tuỳ máy","Không biết"],c:0},
{q:"Biến giúp chương trình Scratch làm gì?",a:["Ghi nhớ giá trị","Trang trí","Phát nhạc","Vẽ"],c:0},
{q:"Trong bài luyện tập, HS cần tạo và chạy chương trình gì?",a:["Theo hình mẫu","Theo ý thích","Chơi game","Vẽ"],c:0},
{q:"Bổ sung biến trong bài 1 nhằm mục đích gì?",a:["Tính và xuất chu vi","Đổi màu","Vẽ","Chào hỏi"],c:0},
{q:"Bài 2 yêu cầu nhập dữ liệu từ đâu?",a:["Bàn phím","Chuột","Micro","Camera"],c:0},

{q:"Tự đánh giá yêu cầu HS làm được điều gì?",a:["Nêu ví dụ và dùng cấu trúc tuần tự","Chơi game","Vẽ","Soạn thảo"],c:0},
{q:"Mục tiêu bài học gồm mấy ý chính?",a:["2","1","3","4"],c:0},
{q:"Ý thứ nhất của mục tiêu là gì?",a:["Nêu ví dụ cấu trúc tuần tự","Tạo biến","Chào hỏi","Tính toán"],c:0},
{q:"Ý thứ hai của mục tiêu là gì?",a:["Sử dụng cấu trúc tuần tự và biến","Vẽ","Nghe nhạc","In"],c:0},
{q:"Sau bài học, HS cần làm được gì?",a:["Viết chương trình đơn giản","Chơi game","Làm web","Thiết kế"],c:0},

{q:"Khảo sát cuối bài dùng để làm gì?",a:["Đánh giá mức độ hài lòng","Tính điểm","Chơi game","Vẽ"],c:0},
{q:"Trong Scratch, muốn chương trình bắt đầu phải làm gì?",a:["Nháy cờ xanh","Nhấn Enter","Nhấn Space","Nhấn Delete"],c:0},
{q:"Nếu sắp xếp sai thứ tự khối lệnh, chương trình sẽ thế nào?",a:["Không đúng yêu cầu","Đúng","Nhanh hơn","Đẹp hơn"],c:0},
{q:"Cấu trúc tuần tự phù hợp nhất với dạng bài nào?",a:["Các bước lần lượt","Có nhiều nhánh","Lặp vô hạn","Song song"],c:0},
{q:"Khi thiết kế chương trình, bước đầu tiên là gì?",a:["Xác định trình tự công việc","Viết code","Chạy thử","Xóa"],c:0}
];

// TRỘN CÂU HỎI
questions.sort(()=>Math.random()-0.5);
let i=0,score=0,detail=[];
const q=document.getElementById('q'),a=document.getElementById('a'),bar=document.getElementById('bar'),next=document.getElementById('next'),res=document.getElementById('result'),rep=document.getElementById('report');
let total=15*60;const t=document.getElementById('timer');
const cd=setInterval(()=>{total--;t.textContent=Math.floor(total/60)+":"+String(total%60).padStart(2,'0');if(total<=0){clearInterval(cd);finish();}},1000);
function shuffle(x){return x.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);}
function load(){next.style.display='none';const cur=questions[i];q.textContent=`Câu ${i+1}: ${cur.q}`;a.innerHTML='';shuffle(cur.a.map((t,j)=>({t,j}))).forEach(o=>{const b=document.createElement('button');b.textContent=o.t;b.onclick=()=>choose(b,o.j,cur.c,cur.q,o.t);a.appendChild(b)});bar.style.width=(i/questions.length*100)+'%';}
function choose(btn,ch,corr,qt,ans){[...a.children].forEach(b=>b.disabled=true);const ok=ch===corr;btn.classList.add(ok?'correct':'wrong');if(!ok)[...a.children].find(b=>b.textContent===questions[i].a[corr]).classList.add('correct');if(ok)score++;detail.push({qt,ans,cor:questions[i].a[corr],ok});next.style.display='block';}
next.onclick=()=>{i++;i<questions.length?load():finish();};
function finish(){clearInterval(cd);document.getElementById('quiz').style.display='none';next.style.display='none';bar.style.width='100%';res.style.display='block';res.innerHTML=`🎉 Hoàn thành – ${score}/${questions.length}`;rep.style.display='block';let h='<table><tr><th>Câu</th><th>HS</th><th>Đúng</th><th>KQ</th></tr>';detail.forEach((d,k)=>h+=`<tr><td>${k+1}</td><td>${d.ans}</td><td>${d.cor}</td><td>${d.ok?'✔':'✘'}</td></tr>`);h+='</table>';rep.innerHTML=h;}
load();
</script>
</body>
</html>
