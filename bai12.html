<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quiz Classroom PRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#eef4ff;
margin:0;
text-align:center
}

.card{
max-width:900px;
margin:auto;
margin-top:20px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15)
}

input{
padding:10px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
width:220px
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px
}

.answer{
padding:18px;
border-radius:12px;
font-size:18px;
cursor:pointer;
transition:.25s;
font-weight:bold
}

.answer:hover{
transform:scale(1.05)
}

.a0{background:#ff7675}
.a1{background:#74b9ff}
.a2{background:#ffeaa7}
.a3{background:#55efc4}

.correct{
background:#2ecc71!important;
transform:scale(1.15)
}

.wrong{
opacity:.3
}

.timer{
font-size:24px;
color:#e74c3c;
font-weight:bold
}

#progressBar{
width:100%;
height:12px;
background:#ddd;
border-radius:10px;
margin-top:15px;
overflow:hidden
}

#progress{
height:100%;
width:0%;
background:#2ecc71
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:10px;
background:#0984e3;
color:white;
cursor:pointer
}

button:hover{
background:#0652dd
}

canvas{
max-width:300px;
margin-top:20px
}

/* mobile */

@media(max-width:600px){

.answers{
grid-template-columns:1fr
}

.answer{
font-size:16px
}

}

</style>
</head>

<body>

<div class="card">

<h2>Quiz Tin học 5 - Bài 12 - Viết chương trình để tính toán</h2>

<input id="name" placeholder="Họ tên học sinh">
<br><br>

<input id="class" placeholder="Lớp">
<br><br>

<button onclick="start()">BẮT ĐẦU</button>

<div id="quiz" style="display:none">

<div class="timer" id="time">30:00</div>

<div id="progressBar">
<div id="progress"></div>
</div>

<h3 id="question"></h3>

<div class="answers" id="answers"></div>

<div id="correctText"></div>

</div>

<div id="result"></div>

<canvas id="chart"></canvas>

</div>

<audio id="correctSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5b0f4d2c03.mp3"></audio>
<audio id="wrongSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0d30a3c0d2.mp3"></audio>

<script>

let studentName=""
let studentClass=""

let questions=[

["Biểu thức số học dùng để?",["Tính toán","Nghe nhạc","Xem phim","Chơi game"],0],
["Scratch có phép toán nào?",["Cộng","Trừ","Nhân","Tất cả"],3],
["Biểu thức so sánh dùng để?",["So sánh giá trị","Vẽ tranh","Nghe nhạc","Xem phim"],0],
["Phép so sánh trong Scratch trả về?",["Đúng hoặc Sai","Số","Âm thanh","Màu"],0],
["Ví dụ phép toán số học?",["7+3","A>B","X=Y","Sai"],0],

["Biểu thức giúp chương trình?",["Tính toán","Nghe nhạc","Chơi game","Xóa"],0],
["Biểu thức so sánh dùng trong?",["Điều kiện","Âm nhạc","Video","Không"],0],
["Khối phép toán nằm trong nhóm?",["Operators","Motion","Sound","Looks"],0],
["Biểu thức 3+4 bằng?",["7","6","5","8"],0],
["Biểu thức 10-3 bằng?",["7","6","5","8"],0],

["Biểu thức 2*3 bằng?",["6","5","4","7"],0],
["Biểu thức 8/2 bằng?",["4","3","2","5"],0],
["So sánh 3=3 cho kết quả?",["Đúng","Sai","Không","Không biết"],0],
["So sánh 3>5 cho kết quả?",["Sai","Đúng","Không","Không biết"],0],
["So sánh 5>3 cho kết quả?",["Đúng","Sai","Không","Không biết"],0],

["Biểu thức giúp Scratch?",["Tính toán","Ngủ","Dừng","Xóa"],0],
["Biến dùng để?",["Lưu dữ liệu","Nghe nhạc","Xem phim","Chơi game"],0],
["Tạo biến trong Scratch bằng nhóm?",["Variables","Motion","Sound","Looks"],0],
["Tên biến có thể là?",["S","a","b","Tất cả"],3],
["Biến giúp chương trình?",["Lưu giá trị","Xóa giá trị","Sai","Không"],0],

["Giá trị biến có thể?",["Thay đổi","Cố định","Sai","Không"],0],
["Scratch dùng biến để?",["Tính toán","Nghe nhạc","Chơi game","Xem phim"],0],
["Biến thường dùng trong?",["Chương trình","Tranh","Nhạc","Phim"],0],
["Biến giúp lưu?",["Số","Giá trị","Kết quả","Tất cả"],3],
["Biến có thể thay đổi?",["Có","Không","Không biết","Hiếm khi"],0],

["Biểu thức số học dùng trong?",["Tính toán","Nghe nhạc","Xem phim","Chơi game"],0],
["Biểu thức so sánh dùng trong?",["Điều kiện","Âm thanh","Màu","Không"],0],
["Biến giúp lưu tạm?",["Giá trị","Âm thanh","Hình","Không"],0],
["Scratch hỗ trợ biến?",["Có","Không","Không biết","Hiếm khi"],0],
["Biến giúp?",["Tính toán","Nghe nhạc","Sai","Không"],0]

];

questions.sort(()=>Math.random()-0.5)

let current=0
let correctCount=0
let wrongCount=0
let totalTime=1800
let timer

function start(){

studentName=document.getElementById("name").value.trim()
studentClass=document.getElementById("class").value.trim()

if(studentName==""||studentClass==""){
alert("Nhập tên và lớp")
return
}

quiz.style.display="block"

startTimer()

load()

}

function startTimer(){

timer=setInterval(()=>{

totalTime--

let m=Math.floor(totalTime/60)
let s=totalTime%60

time.innerText=
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0')

if(totalTime<=0){
finish()
}

},1000)

}

function load(){

correctText.innerText=""

progress.style.width=(current/questions.length*100)+"%"

question.innerText="Câu "+(current+1)+": "+questions[current][0]

let ans=questions[current][1]
.map((a,i)=>({t:a,i}))
.sort(()=>Math.random()-0.5)

answers.innerHTML=""

ans.forEach((a,k)=>{

answers.innerHTML+=
`<div class="answer a${k}" onclick="choose(${a.i})">${a.t}</div>`

})

}

function choose(i){

let correct=questions[current][2]
let correctAns=questions[current][1][correct]

document.querySelectorAll(".answer").forEach(el=>{

if(el.innerText===correctAns)
el.classList.add("correct")
else
el.classList.add("wrong")

})

if(i===correct){
correctCount++
correctSound.play()
}else{
wrongCount++
wrongSound.play()
}

correctText.innerText="Đáp án đúng: "+correctAns

setTimeout(()=>{

current++

if(current<questions.length){
load()
}else{
finish()
}

},1200)

}

function finish(){

clearInterval(timer)

quiz.style.display="none"

let total=questions.length
let percent=Math.round(correctCount/total*100)

let grade=""

if(percent>=80) grade="Giỏi"
else if(percent>=65) grade="Khá"
else if(percent>=50) grade="Trung bình"
else grade="Cần cố gắng"

result.innerHTML=

"<h2>Hoàn thành bài</h2>"+
"<p>Học sinh: "+studentName+"</p>"+
"<p>Lớp: "+studentClass+"</p>"+
"<h3>Đúng: "+correctCount+"</h3>"+
"<h3>Sai: "+wrongCount+"</h3>"+
"<h3>Tỷ lệ: "+percent+"%</h3>"+
"<h3>Xếp loại: "+grade+"</h3>"+
"<br><button onclick='location.reload()'>Làm lại bài</button>"

drawChart()

}

function drawChart(){

let c=document.getElementById("chart")
let ctx=c.getContext("2d")

let total=correctCount+wrongCount

let correctAngle=(correctCount/total)*2*Math.PI

ctx.clearRect(0,0,300,300)

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,0,correctAngle)
ctx.fillStyle="#2ecc71"
ctx.fill()

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,correctAngle,2*Math.PI)
ctx.fillStyle="#e74c3c"
ctx.fill()

}

</script>

</body>
</html>
