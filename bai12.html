<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quiz Classroom PRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#eef4ff;
margin:0;
text-align:center
}

.card{
max-width:900px;
margin:auto;
margin-top:20px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15)
}

input{
padding:10px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
width:220px
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px
}

.answer{
padding:18px;
border-radius:12px;
font-size:18px;
cursor:pointer;
transition:.25s;
font-weight:bold
}

.answer:hover{
transform:scale(1.05)
}

.a0{background:#ff7675}
.a1{background:#74b9ff}
.a2{background:#ffeaa7}
.a3{background:#55efc4}

.correct{
background:#2ecc71!important;
transform:scale(1.15)
}

.wrong{
opacity:.3
}

.timer{
font-size:24px;
color:#e74c3c;
font-weight:bold
}

#progressBar{
width:100%;
height:12px;
background:#ddd;
border-radius:10px;
margin-top:15px;
overflow:hidden
}

#progress{
height:100%;
width:0%;
background:#2ecc71
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:10px;
background:#0984e3;
color:white;
cursor:pointer
}

button:hover{
background:#0652dd
}

canvas{
max-width:300px;
margin-top:20px
}

/* mobile */

@media(max-width:600px){

.answers{
grid-template-columns:1fr
}

.answer{
font-size:16px
}

}

</style>
</head>

<body>

<div class="card">

<h2>Quiz Tin học 5 - Bài 12 - Viết chương trình để tính toán</h2>

<input id="name" placeholder="Họ tên học sinh">
<br><br>

<input id="class" placeholder="Lớp">
<br><br>

<button onclick="start()">BẮT ĐẦU</button>

<div id="quiz" style="display:none">

<div class="timer" id="time">30:00</div>

<div id="progressBar">
<div id="progress"></div>
</div>

<h3 id="question"></h3>

<div class="answers" id="answers"></div>

<div id="correctText"></div>

</div>

<div id="result"></div>

<canvas id="chart"></canvas>

</div>

<audio id="correctSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5b0f4d2c03.mp3"></audio>
<audio id="wrongSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0d30a3c0d2.mp3"></audio>

<script>

let studentName=""
let studentClass=""

let questions=[

["Biểu thức số học trong Scratch dùng để làm gì?",["Thực hiện phép tính","Phát nhạc","Vẽ hình","Chạy game"],0],
["Trong Scratch phép cộng được kí hiệu bằng gì?",["+","-","*","/"],0],
["Trong Scratch phép trừ được kí hiệu bằng gì?",["-","+","*","/"],0],
["Trong Scratch phép nhân được kí hiệu bằng gì?",["*","+","-","/"],0],
["Trong Scratch phép chia được kí hiệu bằng gì?",["/","+","-","*"],0],

["Biểu thức số học là gì?",["Phép tính với số","Hình ảnh","Âm thanh","Văn bản"],0],
["Ví dụ biểu thức số học là gì?",["3+5","Hello","Scratch","Sprite"],0],
["Biểu thức 3+4 có kết quả bao nhiêu?",["7","6","5","8"],0],
["Biểu thức 10-6 có kết quả bao nhiêu?",["4","3","5","6"],0],
["Biểu thức 3*4 có kết quả bao nhiêu?",["12","7","9","6"],0],

["Biểu thức 12/3 có kết quả bao nhiêu?",["4","3","5","6"],0],
["Biểu thức 5+5 có kết quả bao nhiêu?",["10","9","8","7"],0],
["Biểu thức 9-4 có kết quả bao nhiêu?",["5","6","7","4"],0],
["Biểu thức 2*6 có kết quả bao nhiêu?",["12","10","8","6"],0],
["Biểu thức 8/2 có kết quả bao nhiêu?",["4","2","6","8"],0],

["Biểu thức so sánh dùng để làm gì?",["So sánh hai giá trị","Vẽ hình","Phát nhạc","Chạy game"],0],
["Kết quả của biểu thức so sánh là gì?",["Đúng hoặc Sai","Số","Hình","Âm thanh"],0],
["Dấu = trong Scratch dùng để làm gì?",["So sánh bằng nhau","Cộng","Trừ","Nhân"],0],
["Dấu > trong Scratch dùng để làm gì?",["So sánh lớn hơn","So sánh nhỏ hơn","Cộng","Chia"],0],
["Dấu < trong Scratch dùng để làm gì?",["So sánh nhỏ hơn","So sánh lớn hơn","Nhân","Chia"],0],

["Nếu a=3 và b=3 thì a=b cho kết quả gì?",["Đúng","Sai","Không biết","Lỗi"],0],
["Nếu a=5 và b=3 thì a>b cho kết quả gì?",["Đúng","Sai","Không biết","Lỗi"],0],
["Nếu a=2 và b=6 thì a<b cho kết quả gì?",["Đúng","Sai","Không biết","Lỗi"],0],
["Nếu a=4 và b=7 thì a>b cho kết quả gì?",["Sai","Đúng","Không biết","Lỗi"],0],
["Nếu a=9 và b=9 thì a<b cho kết quả gì?",["Sai","Đúng","Không biết","Lỗi"],0],

["Cấu trúc tuần tự là gì?",["Các lệnh thực hiện theo thứ tự","Lệnh chạy ngẫu nhiên","Lệnh chạy lặp","Lệnh chạy song song"],0],
["Trong Scratch chương trình bắt đầu khi nào?",["Nhấn cờ xanh","Nhấn phím A","Nhấn chuột","Nhấn Enter"],0],
["Các lệnh trong cấu trúc tuần tự chạy như thế nào?",["Từ trên xuống dưới","Ngẫu nhiên","Từ dưới lên","Không theo thứ tự"],0],
["Cấu trúc tuần tự thường dùng để làm gì?",["Thực hiện các bước liên tiếp","Lặp lại","So sánh","Xóa dữ liệu"],0],
["Ví dụ cấu trúc tuần tự là gì?",["Di chuyển rồi nói","Lặp vô hạn","So sánh số","Phát nhạc"],0],

["Biến trong Scratch dùng để làm gì?",["Lưu giá trị","Xóa chương trình","Chạy game","Vẽ hình"],0],
["Biến có thể lưu gì?",["Số hoặc dữ liệu","Chỉ hình ảnh","Chỉ âm thanh","Chỉ video"],0],
["Ví dụ tên biến là gì?",["a","Scratch","Game","Music"],0],
["Khi tạo biến ta chọn nhóm lệnh nào?",["Variables","Motion","Sound","Looks"],0],
["Variables nghĩa là gì?",["Biến số","Âm thanh","Chuyển động","Màu sắc"],0],

["Bước đầu tạo biến là gì?",["Chọn Variables","Gõ tên biến","Nhấn OK","Chạy chương trình"],0],
["Sau khi chọn tạo biến cần làm gì?",["Nhập tên biến","Xóa biến","Chạy game","Tắt máy"],0],
["Sau khi nhập tên biến ta làm gì?",["Nhấn OK","Tắt Scratch","Xóa biến","Chạy game"],0],
["Biến có thể thay đổi giá trị không?",["Có","Không","Chỉ một lần","Chỉ khi tắt máy"],0],
["Ví dụ biến trong bài học là gì?",["a","File","Folder","Game"],0],

["Biến S thường dùng để làm gì?",["Lưu kết quả","Lưu hình ảnh","Lưu âm thanh","Lưu video"],0],
["Chương trình tính toán thường dùng gì?",["Biểu thức","Âm thanh","Hình ảnh","Video"],0],
["Scratch có thể tính toán không?",["Có","Không","Chỉ vẽ","Chỉ phát nhạc"],0],
["Ví dụ chương trình tính toán là gì?",["Tính tiền mua vở","Xem phim","Nghe nhạc","Chơi game"],0],
["Khi tính toán ta cần gì?",["Biểu thức số học","Hình ảnh","Âm thanh","Video"],0],

["Chương trình đoán số dùng gì để tạo số bí mật?",["Số ngẫu nhiên","Số cố định","Âm thanh","Hình ảnh"],0],
["Người chơi nhập số bằng gì?",["Bàn phím","Chuột","Loa","Camera"],0],
["Chương trình so sánh gì?",["Số nhập và số bí mật","Ảnh và nhạc","Video và hình","Game và ảnh"],0],
["Trò chơi đoán số kết thúc khi nào?",["Đoán đúng","Đoán sai","Tắt máy","Hết pin"],0],
["Bài học này giúp học sinh làm gì?",["Viết chương trình tính toán","Chơi game","Nghe nhạc","Vẽ tranh"],0]

];

questions.sort(()=>Math.random()-0.5)

let current=0
let correctCount=0
let wrongCount=0
let totalTime=1800
let timer

function start(){

studentName=document.getElementById("name").value.trim()
studentClass=document.getElementById("class").value.trim()

if(studentName==""||studentClass==""){
alert("Nhập tên và lớp")
return
}

quiz.style.display="block"

startTimer()

load()

}

function startTimer(){

timer=setInterval(()=>{

totalTime--

let m=Math.floor(totalTime/60)
let s=totalTime%60

time.innerText=
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0')

if(totalTime<=0){
finish()
}

},1000)

}

function load(){

correctText.innerText=""

progress.style.width=(current/questions.length*100)+"%"

question.innerText="Câu "+(current+1)+": "+questions[current][0]

let ans=questions[current][1]
.map((a,i)=>({t:a,i}))
.sort(()=>Math.random()-0.5)

answers.innerHTML=""

ans.forEach((a,k)=>{

answers.innerHTML+=
`<div class="answer a${k}" onclick="choose(${a.i})">${a.t}</div>`

})

}

function choose(i){

let correct=questions[current][2]
let correctAns=questions[current][1][correct]

document.querySelectorAll(".answer").forEach(el=>{

if(el.innerText===correctAns)
el.classList.add("correct")
else
el.classList.add("wrong")

})

if(i===correct){
correctCount++
correctSound.play()
}else{
wrongCount++
wrongSound.play()
}

correctText.innerText="Đáp án đúng: "+correctAns

setTimeout(()=>{

current++

if(current<questions.length){
load()
}else{
finish()
}

},1200)

}

function finish(){

clearInterval(timer)

quiz.style.display="none"

let total=questions.length
let percent=Math.round(correctCount/total*100)

let grade=""

if(percent>=80) grade="Giỏi"
else if(percent>=65) grade="Khá"
else if(percent>=50) grade="Trung bình"
else grade="Cần cố gắng"

result.innerHTML=

"<h2>Hoàn thành bài</h2>"+
"<p>Học sinh: "+studentName+"</p>"+
"<p>Lớp: "+studentClass+"</p>"+
"<h3>Đúng: "+correctCount+"</h3>"+
"<h3>Sai: "+wrongCount+"</h3>"+
"<h3>Tỷ lệ: "+percent+"%</h3>"+
"<h3>Xếp loại: "+grade+"</h3>"+
"<br><button onclick='location.reload()'>Làm lại bài</button>"

drawChart()

}

function drawChart(){

let c=document.getElementById("chart")
let ctx=c.getContext("2d")

let total=correctCount+wrongCount

let correctAngle=(correctCount/total)*2*Math.PI

ctx.clearRect(0,0,300,300)

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,0,correctAngle)
ctx.fillStyle="#2ecc71"
ctx.fill()

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,correctAngle,2*Math.PI)
ctx.fillStyle="#e74c3c"
ctx.fill()

}

</script>

</body>
</html>
