<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tin học 5 - Bài 14-Viết kịch bản chương trình máy tính</title>

<style>
body{font-family:Arial;background:#eef4ff;margin:0;text-align:center}
.card{max-width:900px;margin:auto;margin-top:30px;background:white;padding:30px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.15)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}
.answer{padding:18px;border-radius:12px;font-size:18px;cursor:pointer;transition:.3s}
.a0{background:#ff7675}.a1{background:#74b9ff}.a2{background:#ffeaa7}.a3{background:#55efc4}
.correct{background:#2ecc71!important;transform:scale(1.15)}
.wrong{opacity:.3}
</style>

</head>

<body oncontextmenu="return false">

<div class="card">

<h2>Tin học 5 – Bài 14</h2>

<input id="name" placeholder="Họ tên học sinh"><br><br>
<button onclick="start()">BẮT ĐẦU</button>

<div id="quiz" style="display:none">
<h3 id="question"></h3>
<div class="answers" id="answers"></div>
<div id="correctText"></div>
</div>

</div>

<script>

document.onkeydown=function(e){
if(e.ctrlKey && e.key=="c") return false
if(e.key=="F12") return false
}

let questions=[

["Kịch bản chương trình dùng để?",["Mô tả chương trình","Nghe nhạc","Xem phim","Chơi game"],0],
["Viết kịch bản giúp?",["Thiết kế chương trình","Nghe nhạc","Xem phim","Không"],0],
["Kịch bản gồm mấy phần?",["3","2","4","5"],0],
["Ba phần của kịch bản là?",["Mở đầu, diễn biến, kết thúc","Âm thanh","Hình ảnh","Không"],0],
["Mở đầu kịch bản dùng để?",["Mô tả bối cảnh","Chơi game","Nghe nhạc","Không"],0],

["Diễn biến kịch bản dùng để?",["Mô tả hoạt động","Nghe nhạc","Xem phim","Không"],0],
["Kết thúc kịch bản dùng để?",["Mô tả kết quả","Nghe nhạc","Chơi game","Không"],0],
["Viết kịch bản cần?",["Ý tưởng","Âm nhạc","Video","Không"],0],
["Ý tưởng chương trình giúp?",["Xây dựng chương trình","Nghe nhạc","Xem phim","Không"],0],
["Viết kịch bản cần làm việc?",["Nhóm","Một mình","Không","Không"],0],

["Kịch bản giúp chương trình?",["Rõ ràng","Sai","Không","Không"],0],
["Kịch bản dùng trong?",["Lập trình","Âm nhạc","Thể dục","Không"],0],
["Ví dụ trò chơi trong bài?",["Mèo hứng táo","Đá bóng","Chạy bộ","Không"],0],
["Trong trò chơi mèo hứng táo?",["Táo rơi","Nhạc","Video","Không"],0],
["Mèo bắt táo sẽ?",["Được điểm","Không","Sai","Không"],0],

["Kịch bản giúp lập trình?",["Dễ hơn","Khó hơn","Sai","Không"],0],
["Viết kịch bản trước khi?",["Lập trình","Nghe nhạc","Xem phim","Không"],0],
["Kịch bản giúp?",["Mô tả hoạt động","Nghe nhạc","Xem phim","Không"],0],
["Kịch bản có thể chỉnh sửa?",["Có","Không","Không biết","Hiếm khi"],0],
["Kịch bản giúp chương trình?",["Hoạt động rõ ràng","Sai","Không","Không"],0]

]

while(questions.length<50){
questions.push(...questions.slice(0,20))
}

questions=questions.slice(0,50)
questions.sort(()=>Math.random()-0.5)

let current=0

function start(){
quiz.style.display="block"
load()
}

function load(){

question.innerText="Câu "+(current+1)+": "+questions[current][0]

let ans=questions[current][1].map((a,i)=>({t:a,i})).sort(()=>Math.random()-0.5)

answers.innerHTML=""

ans.forEach((a,k)=>{
answers.innerHTML+=`<div class="answer a${k}" onclick="choose(${a.i})">${a.t}</div>`
})

}

function choose(i){

let correct=questions[current][2]
let correctAns=questions[current][1][correct]

document.querySelectorAll(".answer").forEach(el=>{
if(el.innerText===correctAns) el.classList.add("correct")
else el.classList.add("wrong")
})

correctText.innerText="Đáp án đúng: "+correctAns

setTimeout(()=>{
current++
if(current<50) load()
},1200)

}

</script>

</body>
</html>
