<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hình học - Diện tích</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #141e30, #243b55);
        margin: 0;
        color: white;
        text-align: center;
    }

    h1 {
        padding: 20px;
        font-size: 32px;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 25px;
        padding: 20px;
    }

    .card {
        background: rgba(255,255,255,0.08);
        padding: 15px;
        border-radius: 15px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        overflow: hidden;
        transition: 0.3s;
    }

    .card:hover {
        box-shadow: 0 0 25px rgba(255,255,255,0.6);
    }

    img {
        width: 100%;
        border-radius: 10px;
        transition: transform 0.4s ease, filter 0.4s;
        cursor: pointer;
    }

    img:hover {
        transform: scale(1.2);
        filter: brightness(1.2);
    }

    h2 {
        margin-top: 10px;
        color: #ffd700;
    }

    /* Lightbox */
    .lightbox {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.9);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .lightbox img {
        max-width: 80%;
        max-height: 80%;
        border-radius: 10px;
        transform: scale(1);
    }

    .lightbox:active {
        display: none;
    }

</style>

</head>

<body>

<h1>📐 Công thức tính diện tích các hình thông dụng</h1>

<div class="gallery">

    <div class="card">
        <img src="https://i.postimg.cc/tCWLSVxf/Dt-Hinh-Vuong.png" onclick="openImg(this.src)">
        <h2>🟦 Hình vuông</h2>
    </div>

    <div class="card">
        <img src="https://i.postimg.cc/CLkWPfqr/Dt-HCN.png" onclick="openImg(this.src)">
        <h2>🟩 Hình chữ nhật</h2>
    </div>

    <div class="card">
        <img src="https://i.postimg.cc/Fs32WJL6/Dt-Tam-Giac.png" onclick="openImg(this.src)">
        <h2>🔺 Hình tam giác</h2>
    </div>

    <div class="card">
        <img src="https://i.postimg.cc/9XbJCrgr/Dt-Hinh-Tron.png" onclick="openImg(this.src)">
        <h2>⚪ Hình tròn</h2>
    </div>

</div>

<div class="container">
    <h1>Công thức tính chu vi</h1>

    <div class="card">
        <h2>🔷 Hình vuông</h2>
        <p class="formula">P = 4 × a</p>
        <p>a: độ dài cạnh</p>
    </div>

    <div class="card">
        <h2>🔶 Hình chữ nhật</h2>
        <p class="formula">P = 2 × (a + b)</p>
        <p>a: chiều dài, b: chiều rộng</p>
    </div>

    <div class="card">
        <h2>🔺 Hình tam giác</h2>
        <p class="formula">P = a + b + c</p>
        <p>a, b, c: độ dài 3 cạnh</p>
    </div>
</div>    

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeImg()">
    <img id="lightbox-img">
</div>

<script>
function openImg(src) {
    document.getElementById("lightbox").style.display = "flex";
    document.getElementById("lightbox-img").src = src;
}

function closeImg() {
    document.getElementById("lightbox").style.display = "none";
}
</script>

</body>
</html>
