<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trắc nghiệm Tin học 5 - Bài 1</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#74b9ff,#a29bfe);
margin:0;
text-align:center;
}

.card{
max-width:900px;
margin:auto;
margin-top:40px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 15px 30px rgba(0,0,0,.2)
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px
}

.answer{
padding:18px;
border-radius:12px;
font-size:18px;
cursor:pointer;
transition:.25s
}

.answer:hover{
transform:scale(1.05)
}

.a0{background:#ff7675}
.a1{background:#74b9ff}
.a2{background:#ffeaa7}
.a3{background:#55efc4}

.correct{
background:#2ecc71!important;
transform:scale(1.1)
}

.wrong{
opacity:.3
}

.timer{
font-size:22px;
color:#e74c3c;
font-weight:bold
}

.score{
font-size:20px;
color:#2d3436;
margin-top:10px
}

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:10px;
background:#6c5ce7;
color:white;
cursor:pointer
}

button:hover{
background:#4834d4
}

.result{
font-size:28px;
color:#2d3436;
margin-top:20px
}

</style>

</head>

<body>

<div class="card">

<h2>Tin học 5 – Bài 1</h2>

<input id="name" placeholder="Họ tên học sinh">
<br><br>

<button onclick="start()">BẮT ĐẦU</button>

<div id="quiz" style="display:none">

<div class="timer" id="time">30:00</div>

<div class="score" id="score">Điểm: 0</div>

<h3 id="question"></h3>

<div class="answers" id="answers"></div>

<div id="correctText"></div>

<div class="result" id="result"></div>

</div>

</div>

<script>

let questions=[

["Máy tính có thể giúp em học tập những gì?",["Học tiếng Anh","Học Toán","Khám phá Hệ mặt trời","Tất cả"],3],
["Máy tính giúp em luyện tập sử dụng thiết bị nào?",["Chuột","Bàn phím","Cả hai","Không"],2],
["Máy tính giúp tạo sản phẩm số nào?",["PowerPoint","Word","Scratch","Tất cả"],3],
["Bài trình chiếu được tạo bằng phần mềm nào?",["PowerPoint","Paint","Excel","Chrome"],0],
["Văn bản được soạn thảo bằng phần mềm nào?",["Word","Paint","Scratch","Chrome"],0],
["Máy tính có thể tạo sản phẩm nào?",["Hình ảnh","Bản nhạc","Phim hoạt hình","Tất cả"],3],
["Máy tính giúp tìm thông tin bằng công cụ nào?",["Google","Internet","Website","Tất cả"],3],
["Máy tính giúp chia sẻ thông tin qua công cụ nào?",["Zalo","Messenger Kids","Email","Tất cả"],3],
["Máy tính giúp giải trí bằng cách nào?",["Chơi trò chơi","Nghe nhạc","Đọc truyện","Tất cả"],3],
["Máy tính có thể dùng để đọc gì?",["Sách","Truyện","Báo","Tất cả"],3]

]

while(questions.length<50){
questions.push(...questions)
}

questions=questions.slice(0,50)

questions.sort(()=>Math.random()-0.5)

let current=0
let score=0
let answered=false

let totalTime=30*60

setInterval(()=>{

if(totalTime<=0){
finish()
return
}

totalTime--

let m=Math.floor(totalTime/60)
let s=totalTime%60

time.innerText=
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0")

},1000)

function start(){

quiz.style.display="block"

name.style.display="none"

event.target.style.display="none"

load()

}

function load(){

answered=false

let q=questions[current]

question.innerText="Câu "+(current+1)+": "+q[0]

let ans=q[1]
.map((a,i)=>({t:a,i}))
.sort(()=>Math.random()-0.5)

answers.innerHTML=""

ans.forEach((a,k)=>{

answers.innerHTML+=
`<div class="answer a${k}" onclick="choose(${a.i})">${a.t}</div>`

})

}

function choose(i){

if(answered) return

answered=true

let q=questions[current]

let correct=q[2]

document.querySelectorAll(".answer").forEach(el=>{

if(el.innerText===q[1][correct])
el.classList.add("correct")

else
el.classList.add("wrong")

})

if(i===correct){
score++
scoreText()
}

setTimeout(()=>{

current++

if(current>=50) finish()

else load()

},1200)

}

function scoreText(){
document.getElementById("score").innerText="Điểm: "+score
}

function finish(){

quiz.innerHTML=

"<h2>Hoàn thành!</h2>"+
"<div class='result'>Điểm của bạn: "+score+"/50</div>"

}

</script>

</body>
</html>
