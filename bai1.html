<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>QUIZ CLASSROOM PRO</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#6c5ce7,#74b9ff);
margin:0;
text-align:center
}

.card{
max-width:900px;
margin:auto;
margin-top:30px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25)
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px
}

.answer{
padding:18px;
border-radius:12px;
font-size:18px;
cursor:pointer;
font-weight:bold;
transition:.3s
}

.answer:hover{transform:scale(1.05)}

.a0{background:#ff7675}
.a1{background:#74b9ff}
.a2{background:#ffeaa7}
.a3{background:#55efc4}

.correct{
background:#2ecc71!important;
transform:scale(1.1)
}

.wrong{
opacity:.3
}

.timer{
font-size:22px;
color:#e74c3c;
font-weight:bold
}

#progressBar{
width:100%;
height:12px;
background:#ddd;
border-radius:20px;
margin-top:15px;
overflow:hidden
}

#progress{
height:100%;
width:0%;
background:#2ecc71
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:10px;
background:#0984e3;
color:white;
cursor:pointer
}

button:hover{
background:#0652dd
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px
}

th,td{
border:1px solid #ccc;
padding:10px
}

th{
background:#0984e3;
color:white
}

</style>
</head>

<body>

<div class="card">

<h2>Tin học 5 – Quiz Classroom</h2>

<input id="name" placeholder="Họ tên học sinh">
<br><br>

<button onclick="start()">BẮT ĐẦU</button>

<div id="quiz" style="display:none">

<div class="timer" id="time">30:00</div>

<div id="progressBar">
<div id="progress"></div>
</div>

<h3 id="question"></h3>

<div class="answers" id="answers"></div>

<div id="correctText"></div>

</div>

<div id="result"></div>

<h3>Bảng xếp hạng lớp</h3>

<table id="leaderboard">

<tr>
<th>Học sinh</th>
<th>Điểm</th>
</tr>

</table>

<button onclick="exportCSV()">Xuất Excel</button>

</div>

<script>

/* dữ liệu học sinh */
let students=[]

/* câu hỏi */

let questions=[

["Máy tính giúp em làm gì?",["Học tập","Làm việc","Giải trí","Tất cả"],3],
["Phần mềm trình chiếu là gì?",["PowerPoint","Word","Paint","Chrome"],0],
["Soạn thảo văn bản dùng phần mềm?",["Word","Excel","Scratch","Paint"],0],
["Máy tính giúp tìm thông tin bằng gì?",["Internet","Sách","TV","Báo"],0],
["Máy tính có thể tạo sản phẩm số?",["Có","Không","Hiếm khi","Không biết"],0]

]

questions.sort(()=>Math.random()-0.5)

/* biến */

let current=0
let score=0
let lock=false

/* timer */

let totalTime=1800
let timer

function startTimer(){

timer=setInterval(()=>{

totalTime--

let m=Math.floor(totalTime/60)
let s=totalTime%60

time.innerText=
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0')

if(totalTime<=0){

finish()

}

},1000)

}

/* start */

function start(){

if(name.value==""){
alert("Nhập tên học sinh")
return
}

quiz.style.display="block"

startTimer()

load()

}

/* load */

function load(){

lock=false

progress.style.width=
(current/questions.length*100)+"%"

question.innerText=
"Câu "+(current+1)+": "+questions[current][0]

let ans=
questions[current][1]
.map((a,i)=>({t:a,i}))
.sort(()=>Math.random()-0.5)

answers.innerHTML=""

ans.forEach((a,k)=>{

answers.innerHTML+=
`<div class="answer a${k}" onclick="choose(${a.i})">${a.t}</div>`

})

}

/* chọn */

function choose(i){

if(lock) return

lock=true

let correct=questions[current][2]

let correctAns=questions[current][1][correct]

document.querySelectorAll(".answer").forEach(el=>{

if(el.innerText===correctAns)
el.classList.add("correct")
else
el.classList.add("wrong")

})

if(i===correct) score++

correctText.innerText="Đáp án đúng: "+correctAns

setTimeout(()=>{

current++

if(current<questions.length){

load()

}else{

finish()

}

},1200)

}

/* kết thúc */

function finish(){

clearInterval(timer)

quiz.style.display="none"

result.innerHTML=
"<h2>Điểm: "+score+" / "+questions.length+"</h2>"

/* lưu bảng điểm */

students.push({
name:name.value,
score:score
})

updateBoard()

}

/* bảng xếp hạng */

function updateBoard(){

students.sort((a,b)=>b.score-a.score)

leaderboard.innerHTML=
"<tr><th>Học sinh</th><th>Điểm</th></tr>"

students.forEach(s=>{

leaderboard.innerHTML+=
"<tr><td>"+s.name+"</td><td>"+s.score+"</td></tr>"

})

}

/* xuất excel */

function exportCSV(){

let csv="Học sinh,Điểm\n"

students.forEach(s=>{

csv+=s.name+","+s.score+"\n"

})

let blob=
new Blob([csv],{type:"text/csv"})

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="bang_diem.csv"

a.click()

}

</script>

</body>
</html>
