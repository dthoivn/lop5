<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>QUIZ CLASSROOM</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#6c5ce7,#74b9ff);
margin:0;
text-align:center
}

.card{
max-width:900px;
margin:auto;
margin-top:30px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25)
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px
}

.answer{
padding:18px;
border-radius:12px;
font-size:18px;
cursor:pointer;
font-weight:bold;
transition:.3s
}

.answer:hover{transform:scale(1.05)}

.a0{background:#ff7675}
.a1{background:#74b9ff}
.a2{background:#ffeaa7}
.a3{background:#55efc4}

.correct{
background:#2ecc71!important;
transform:scale(1.1)
}

.wrong{
opacity:.3
}

.timer{
font-size:22px;
color:#e74c3c;
font-weight:bold
}

#progressBar{
width:100%;
height:12px;
background:#ddd;
border-radius:20px;
margin-top:15px;
overflow:hidden
}

#progress{
height:100%;
width:0%;
background:#2ecc71
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:10px;
background:#0984e3;
color:white;
cursor:pointer
}

button:hover{
background:#0652dd
}

</style>
</head>

<body>

<div class="card">

<h2>Tin học 5 – Bài 1 - MÁY TÍNH CÓ THỂ GIÚP EM LÀM NHỮNG VIỆC GÌ?</h2>

<input id="name" placeholder="Họ tên học sinh">
<br><br>

<button onclick="start()">BẮT ĐẦU</button>

<div id="quiz" style="display:none">

<div class="timer" id="time">30:00</div>

<div id="progressBar">
<div id="progress"></div>
</div>

<h3 id="question"></h3>

<div class="answers" id="answers"></div>

<div id="correctText"></div>

</div>

<div id="result"></div>

</div>

<script>

let studentName=""

/* câu hỏi */

let questions=[

["Máy tính có thể giúp em học tập những gì?",["Học tiếng Anh","Học Toán","Khám phá Hệ mặt trời","Tất cả"],3],
["Máy tính giúp em luyện tập sử dụng thiết bị nào?",["Chuột","Bàn phím","Cả hai","Không"],2],
["Máy tính giúp tạo sản phẩm số nào?",["PowerPoint","Word","Scratch","Tất cả"],3],
["Bài trình chiếu được tạo bằng phần mềm nào?",["PowerPoint","Paint","Excel","Chrome"],0],
["Văn bản được soạn thảo bằng phần mềm nào?",["Word","Paint","Scratch","Chrome"],0],
["Máy tính có thể tạo sản phẩm nào?",["Hình ảnh","Bản nhạc","Phim hoạt hình","Tất cả"],3],
["Máy tính giúp tìm thông tin bằng công cụ nào?",["Google","Internet","Website","Tất cả"],3],
["Máy tính giúp chia sẻ thông tin qua công cụ nào?",["Zalo","Messenger Kids","Email","Tất cả"],3],
["Máy tính giúp giải trí bằng cách nào?",["Chơi trò chơi","Nghe nhạc","Đọc truyện","Tất cả"],3],
["Máy tính có thể dùng để đọc gì?",["Sách","Truyện","Báo","Tất cả"],3],

["Máy tính giúp xem gì?",["Phim","Video","Tin tức","Tất cả"],3],
["Máy tính giúp giao lưu với ai?",["Bạn bè","Người thân","Bạn học","Tất cả"],3],
["Máy tính là công cụ giúp làm gì?",["Học tập","Làm việc","Giải trí","Tất cả"],3],
["Máy tính có thể giúp học môn nào?",["Tiếng Anh","Toán","Khoa học","Tất cả"],3],
["Máy tính giúp luyện kỹ năng gì?",["Chuột","Bàn phím","Phần mềm học","Tất cả"],3],

["Sản phẩm số là gì?",["Sản phẩm tạo bằng máy tính","Sản phẩm giấy","Sản phẩm gỗ","Sản phẩm nhựa"],0],
["Máy tính giúp tìm hiểu điều gì?",["Khoa học","Thiên văn","Thể thao","Tất cả"],3],
["Máy tính giúp hợp tác với ai?",["Bạn bè","Nhóm học","Thầy cô","Tất cả"],3],
["Chương trình kể chuyện được tạo bằng phần mềm nào?",["Scratch","Word","Paint","Excel"],0],
["Máy tính giúp học sinh làm gì tốt hơn?",["Học tập","Trao đổi thông tin","Giải trí","Tất cả"],3],

["Máy tính có thể giúp học sinh làm việc nhóm không?",["Có","Không","Chỉ đôi khi","Không biết"],0],
["Máy tính giúp tìm thông tin nhanh hơn bằng gì?",["Internet","Sách","Báo","TV"],0],
["Máy tính có thể tạo ra phim hoạt hình không?",["Có","Không","Không biết","Chỉ đôi khi"],0],
["Máy tính có thể giúp học sinh học tiếng Anh không?",["Có","Không","Không biết","Hiếm khi"],0],
["Máy tính giúp tạo bài trình chiếu để làm gì?",["Trình bày bài học","Nghe nhạc","Chơi game","Xem phim"],0],

["Máy tính giúp trao đổi thông tin bằng cách nào?",["Internet","Thư điện tử","Ứng dụng nhắn tin","Tất cả"],3],
["Máy tính giúp học sinh khám phá gì?",["Hệ mặt trời","Thiên nhiên","Khoa học","Tất cả"],3],
["Máy tính có thể dùng để cập nhật tin tức không?",["Có","Không","Hiếm khi","Không biết"],0],
["Máy tính giúp học sinh đọc báo không?",["Có","Không","Hiếm khi","Không biết"],0],
["Máy tính có thể giúp xem video học tập không?",["Có","Không","Hiếm khi","Không biết"],0],

["Máy tính giúp học sinh làm bài tập không?",["Có","Không","Không biết","Hiếm khi"],0],
["Máy tính giúp học sinh luyện gõ bàn phím không?",["Có","Không","Hiếm khi","Không biết"],0],
["Máy tính có thể giúp học sinh luyện chuột không?",["Có","Không","Không biết","Hiếm khi"],0],
["Máy tính giúp tạo hình ảnh số không?",["Có","Không","Hiếm khi","Không biết"],0],
["Máy tính có thể tạo bản nhạc số không?",["Có","Không","Không biết","Hiếm khi"],0],

["Máy tính giúp tạo phim hoạt hình không?",["Có","Không","Hiếm khi","Không biết"],0],
["Máy tính giúp học sinh giao lưu bạn bè không?",["Có","Không","Không biết","Hiếm khi"],0],
["Máy tính có thể dùng để chơi trò chơi không?",["Có","Không","Hiếm khi","Không biết"],0],
["Máy tính giúp nghe nhạc không?",["Có","Không","Không biết","Hiếm khi"],0],
["Máy tính giúp đọc sách điện tử không?",["Có","Không","Không biết","Hiếm khi"],0],

["Máy tính có thể dùng để xem phim không?",["Có","Không","Không biết","Hiếm khi"],0],
["Máy tính giúp cập nhật tin tức không?",["Có","Không","Không biết","Hiếm khi"],0],
["Máy tính có thể giúp học sinh học online không?",["Có","Không","Hiếm khi","Không biết"],0],
["Máy tính giúp tìm kiếm thông tin nhanh không?",["Có","Không","Không biết","Hiếm khi"],0],
["Máy tính giúp học sinh làm nhiều việc không?",["Có","Không","Hiếm khi","Không biết"],0],

["Máy tính có phải công cụ đa năng không?",["Có","Không","Không biết","Hiếm khi"],0],
["Máy tính giúp con người làm nhiều việc không?",["Có","Không","Không biết","Hiếm khi"],0],
["Có nên học sử dụng máy tính thành thạo không?",["Có","Không","Không biết","Hiếm khi"],0]

]

questions.sort(()=>Math.random()-0.5)

/* biến */

let current=0
let correctCount=0
let wrongCount=0
let lock=false

/* timer */

let totalTime=1800
let timer

function startTimer(){

timer=setInterval(()=>{

totalTime--

let m=Math.floor(totalTime/60)
let s=totalTime%60

time.innerText=
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0')

if(totalTime<=0){

finish()

}

},1000)

}

/* start */

function start(){

studentName=document.getElementById("name").value.trim()

if(studentName==""){
alert("Nhập tên học sinh")
return
}

quiz.style.display="block"

startTimer()

load()

}

/* load câu hỏi */

function load(){

lock=false

correctText.innerText=""

progress.style.width=(current/questions.length*100)+"%"

question.innerText="Câu "+(current+1)+": "+questions[current][0]

let ans=
questions[current][1]
.map((a,i)=>({t:a,i}))
.sort(()=>Math.random()-0.5)

answers.innerHTML=""

ans.forEach((a,k)=>{

answers.innerHTML+=
`<div class="answer a${k}" onclick="choose(${a.i})">${a.t}</div>`

})

}

/* chọn đáp án */

function choose(i){

if(lock) return

lock=true

let correct=questions[current][2]

let correctAns=questions[current][1][correct]

document.querySelectorAll(".answer").forEach(el=>{

if(el.innerText===correctAns)
el.classList.add("correct")
else
el.classList.add("wrong")

})

if(i===correct){
correctCount++
}else{
wrongCount++
}

correctText.innerText="Đáp án đúng: "+correctAns

setTimeout(()=>{

current++

if(current<questions.length){
load()
}else{
finish()
}

},1200)

}

/* kết thúc */

function finish(){

clearInterval(timer)

quiz.style.display="none"

let total=questions.length

let percent=Math.round(correctCount/total*100)

result.innerHTML=
"<h2>Hoàn thành bài</h2>"+
"<p>Học sinh: "+studentName+"</p>"+
"<h3>Tổng câu: "+total+"</h3>"+
"<h3>Đúng: "+correctCount+"</h3>"+
"<h3>Sai: "+wrongCount+"</h3>"+
"<h3>Tỷ lệ đúng: "+percent+"%</h3>"

}

</script>

</body>
</html>
