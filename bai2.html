<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>QUIZ CLASSROOM</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#6c5ce7,#74b9ff);
margin:0;
text-align:center
}

.card{
max-width:900px;
margin:auto;
margin-top:30px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25)
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px
}

.answer{
padding:18px;
border-radius:12px;
font-size:18px;
cursor:pointer;
font-weight:bold;
transition:.3s
}

.answer:hover{transform:scale(1.05)}

.a0{background:#ff7675}
.a1{background:#74b9ff}
.a2{background:#ffeaa7}
.a3{background:#55efc4}

.correct{
background:#2ecc71!important;
transform:scale(1.1)
}

.wrong{
opacity:.3
}

.timer{
font-size:22px;
color:#e74c3c;
font-weight:bold
}

#progressBar{
width:100%;
height:12px;
background:#ddd;
border-radius:20px;
margin-top:15px;
overflow:hidden
}

#progress{
height:100%;
width:0%;
background:#2ecc71
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:10px;
background:#0984e3;
color:white;
cursor:pointer
}

button:hover{
background:#0652dd
}

</style>
</head>

<body>

<div class="card">

<h2>Tin học 5 – Bài 2 - Tìm thông tin trên website</h2>

<input id="name" placeholder="Họ tên học sinh">
<br><br>

<button onclick="start()">BẮT ĐẦU</button>

<div id="quiz" style="display:none">

<div class="timer" id="time">30:00</div>

<div id="progressBar">
<div id="progress"></div>
</div>

<h3 id="question"></h3>

<div class="answers" id="answers"></div>

<div id="correctText"></div>

</div>

<div id="result"></div>

</div>

<script>

let studentName=""

/* câu hỏi */

let questions=[

["Danh mục trên website giúp người dùng làm gì?",["Dễ tìm thông tin","Trang trí","Chơi game","Không có tác dụng"],0],
["Website truyencotich.vn dùng để làm gì?",["Đọc truyện","Nghe nhạc","Xem phim","Chơi game"],0],
["Danh mục nào có trên website truyện?",["Cổ tích Việt Nam","Cổ tích thế giới","Truyện thiếu nhi","Tất cả"],3],
["Thông tin trên website thường được sắp xếp theo?",["Danh mục","Màu sắc","Hình ảnh","Âm thanh"],0],
["Công cụ tìm kiếm trên website giúp gì?",["Tìm thông tin","Nghe nhạc","Chơi game","Vẽ tranh"],0],

["Muốn tìm truyện Tấm Cám cần làm gì?",["Nhập từ khóa","Tắt máy","Mở Paint","In trang"],0],
["Từ khóa dùng để làm gì?",["Tìm thông tin","Chơi game","Nghe nhạc","In"],0],
["Ô tìm kiếm dùng để làm gì?",["Nhập từ khóa","Xem phim","Chơi game","Nghe nhạc"],0],
["Sau khi nhập từ khóa cần nhấn gì?",["Search","Esc","Delete","Enter máy"],0],
["Website cung cấp công cụ tìm kiếm để?",["Giúp tìm thông tin nhanh","Trang trí","Chơi game","In"],0],

["Truy cập website cần dùng gì?",["Internet","USB","Máy in","Loa"],0],
["Website giúp tìm thông tin gì?",["Truyện","Tin tức","Bài học","Tất cả"],3],
["Website giúp chia sẻ thông tin không?",["Có","Không","Không biết","Hiếm khi"],0],
["Website giúp học sinh học tập không?",["Có","Không","Không biết","Hiếm khi"],0],
["Danh mục giúp website trở nên?",["Dễ sử dụng","Khó dùng","Không đổi","Phức tạp"],0],

["Tìm thông tin theo danh mục giúp?",["Nhanh hơn","Chậm hơn","Không đổi","Sai"],0],
["Tìm kiếm bằng từ khóa giúp?",["Nhanh","Chậm","Không hiệu quả","Sai"],0],
["Từ khóa nên?",["Phù hợp","Sai","Ngẫu nhiên","Dài"],0],
["Danh mục truyện giúp?",["Phân loại truyện","Chơi game","Nghe nhạc","Xem phim"],0],
["Website truyencotich.vn chứa?",["Truyện cổ tích","Tin tức","Video","Game"],0],

["Website giúp tìm truyện?",["Tấm Cám","Sự tích cây khế","Cả hai","Không"],2],
["Website có thể dùng để học không?",["Có","Không","Không biết","Hiếm khi"],0],
["Website giúp học sinh tìm thông tin nhanh không?",["Có","Không","Không biết","Hiếm khi"],0],
["Website có danh mục để?",["Phân loại thông tin","Chơi game","Nghe nhạc","Xem phim"],0],
["Danh mục giúp tìm thông tin?",["Nhanh hơn","Chậm hơn","Không đổi","Sai"],0],

["Công cụ tìm kiếm giúp?",["Tìm nhanh","Chậm","Sai","Không"],0],
["Tìm thông tin cần?",["Từ khóa","Game","Âm nhạc","Video"],0],
["Tìm thông tin trên website cần?",["Internet","Chuột","Bàn phím","Tất cả"],3],
["Website có thể chứa?",["Truyện","Tin tức","Thông tin","Tất cả"],3],
["Website có thể chia sẻ thông tin?",["Có","Không","Không biết","Hiếm khi"],0],

["Website giúp hợp tác học tập không?",["Có","Không","Không biết","Hiếm khi"],0],
["Website giúp tìm truyện nhanh?",["Có","Không","Không biết","Hiếm khi"],0],
["Website có ô tìm kiếm?",["Có","Không","Không biết","Hiếm khi"],0],
["Tìm thông tin cần nhập?",["Từ khóa","Mật khẩu","Tên giáo viên","Tên lớp"],0],
["Search nghĩa là?",["Tìm kiếm","In","Xóa","Lưu"],0],

["Website giúp đọc truyện online?",["Có","Không","Không biết","Hiếm khi"],0],
["Website giúp học sinh đọc truyện cổ tích?",["Có","Không","Không biết","Hiếm khi"],0],
["Website giúp học sinh tìm kiến thức?",["Có","Không","Không biết","Hiếm khi"],0],
["Website giúp tìm thông tin nhanh?",["Có","Không","Không biết","Hiếm khi"],0],
["Website giúp chia sẻ thông tin?",["Có","Không","Không biết","Hiếm khi"],0],

["Internet giúp truy cập website?",["Có","Không","Không biết","Hiếm khi"],0],
["Website có thể dùng để học?",["Có","Không","Không biết","Hiếm khi"],0],
["Website có thể dùng để đọc tin?",["Có","Không","Không biết","Hiếm khi"],0],
["Website giúp tìm truyện nhanh?",["Có","Không","Không biết","Hiếm khi"],0],
["Website giúp học sinh học tốt hơn?",["Có","Không","Không biết","Hiếm khi"],0]

]

questions.sort(()=>Math.random()-0.5)

/* biến */

let current=0
let correctCount=0
let wrongCount=0
let lock=false

/* timer */

let totalTime=1800
let timer

function startTimer(){

timer=setInterval(()=>{

totalTime--

let m=Math.floor(totalTime/60)
let s=totalTime%60

time.innerText=
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0')

if(totalTime<=0){

finish()

}

},1000)

}

/* start */

function start(){

studentName=document.getElementById("name").value.trim()

if(studentName==""){
alert("Nhập tên học sinh")
return
}

quiz.style.display="block"

startTimer()

load()

}

/* load câu hỏi */

function load(){

lock=false

correctText.innerText=""

progress.style.width=(current/questions.length*100)+"%"

question.innerText="Câu "+(current+1)+": "+questions[current][0]

let ans=
questions[current][1]
.map((a,i)=>({t:a,i}))
.sort(()=>Math.random()-0.5)

answers.innerHTML=""

ans.forEach((a,k)=>{

answers.innerHTML+=
`<div class="answer a${k}" onclick="choose(${a.i})">${a.t}</div>`

})

}

/* chọn đáp án */

function choose(i){

if(lock) return

lock=true

let correct=questions[current][2]

let correctAns=questions[current][1][correct]

document.querySelectorAll(".answer").forEach(el=>{

if(el.innerText===correctAns)
el.classList.add("correct")
else
el.classList.add("wrong")

})

if(i===correct){
correctCount++
}else{
wrongCount++
}

correctText.innerText="Đáp án đúng: "+correctAns

setTimeout(()=>{

current++

if(current<questions.length){
load()
}else{
finish()
}

},1200)

}

/* kết thúc */

function finish(){

clearInterval(timer)

quiz.style.display="none"

let total=questions.length

let percent=Math.round(correctCount/total*100)

result.innerHTML=
"<h2>Hoàn thành bài</h2>"+
"<p>Học sinh: "+studentName+"</p>"+
"<h3>Tổng câu: "+total+"</h3>"+
"<h3>Đúng: "+correctCount+"</h3>"+
"<h3>Sai: "+wrongCount+"</h3>"+
"<h3>Tỷ lệ đúng: "+percent+"%</h3>"

}

</script>

</body>
</html>
