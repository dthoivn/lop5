<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>QUIZ CLASSROOM</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#6c5ce7,#74b9ff);
margin:0;
text-align:center
}

.card{
max-width:900px;
margin:auto;
margin-top:30px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25)
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px
}

.answer{
padding:18px;
border-radius:12px;
font-size:18px;
cursor:pointer;
font-weight:bold;
transition:.3s
}

.answer:hover{transform:scale(1.05)}

.a0{background:#ff7675}
.a1{background:#74b9ff}
.a2{background:#ffeaa7}
.a3{background:#55efc4}

.correct{
background:#2ecc71!important;
transform:scale(1.1)
}

.wrong{
opacity:.3
}

.timer{
font-size:22px;
color:#e74c3c;
font-weight:bold
}

#progressBar{
width:100%;
height:12px;
background:#ddd;
border-radius:20px;
margin-top:15px;
overflow:hidden
}

#progress{
height:100%;
width:0%;
background:#2ecc71
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:10px;
background:#0984e3;
color:white;
cursor:pointer
}

button:hover{
background:#0652dd
}

</style>
</head>

<body>

<div class="card">

<h2>Tin học 5 - Bài 3-Thông tin trong giải quyết vấn đề</h2>

<input id="name" placeholder="Họ tên học sinh">
<br><br>

<button onclick="start()">BẮT ĐẦU</button>

<div id="quiz" style="display:none">

<div class="timer" id="time">30:00</div>

<div id="progressBar">
<div id="progress"></div>
</div>

<h3 id="question"></h3>

<div class="answers" id="answers"></div>

<div id="correctText"></div>

</div>

<div id="result"></div>

</div>

<script>

let studentName=""

/* câu hỏi */

let questions=[

["Thu thập thông tin giúp gì?",["Giải quyết vấn đề","Chơi game","Nghe nhạc","Không"],0],
["Bạn An cần tìm thông tin về đâu?",["Châu Nam Cực","Châu Á","Châu Phi","Châu Âu"],0],
["Bạn An có thể tìm thông tin bằng cách nào?",["Internet","Thư viện","Cả hai","Không"],2],
["Sau khi thu thập thông tin cần làm gì?",["Lựa chọn thông tin","Xóa","In","Chơi"],0],
["Thông tin cần đảm bảo gì?",["Chính xác","Liên quan","Tin cậy","Tất cả"],3],

["Quyết định dựa trên gì?",["Thông tin","May mắn","Đoán","Không"],0],
["Tìm thông tin cần?",["Từ khóa","Game","Nhạc","Video"],0],
["Thông tin cần?",["Liên quan","Chính xác","Đầy đủ","Tất cả"],3],
["Tìm thông tin giúp?",["Giải quyết vấn đề","Chơi game","Nghe nhạc","Không"],0],
["Thông tin sai có nên dùng?",["Không","Có","Đôi khi","Không biết"],0],

["Thông tin dự báo thời tiết giúp?",["Quyết định mang áo mưa","Chơi game","Nghe nhạc","Xem phim"],0],
["Thông tin hôm qua có phù hợp cho ngày mai không?",["Không","Có","Không biết","Đôi khi"],0],
["Thông tin địa phương khác có phù hợp không?",["Không","Có","Không biết","Đôi khi"],0],
["Thông tin từ bác sĩ có đáng tin không?",["Có","Không","Không biết","Đôi khi"],0],
["Thông tin từ mạng xã hội luôn đúng không?",["Không","Có","Không biết","Đôi khi"],0],

["Thông tin cần kiểm tra?",["Có","Không","Không biết","Hiếm khi"],0],
["Thu thập thông tin giúp học sinh?",["Giải quyết vấn đề","Chơi game","Nghe nhạc","Không"],0],
["Thông tin giúp đưa ra?",["Quyết định","Trò chơi","Âm nhạc","Phim"],0],
["Thông tin sai có thể gây?",["Sai quyết định","Đúng","Không","Không biết"],0],
["Thông tin cần?",["Tin cậy","Chính xác","Liên quan","Tất cả"],3],

["Internet giúp tìm thông tin?",["Có","Không","Không biết","Hiếm khi"],0],
["Thư viện giúp tìm thông tin?",["Có","Không","Không biết","Hiếm khi"],0],
["Thông tin cần kiểm chứng?",["Có","Không","Không biết","Hiếm khi"],0],
["Thông tin giúp giải quyết vấn đề?",["Có","Không","Không biết","Hiếm khi"],0],
["Thông tin cần lựa chọn?",["Có","Không","Không biết","Hiếm khi"],0],

["Thông tin cần mới?",["Có","Không","Không biết","Hiếm khi"],0],
["Thông tin cần đầy đủ?",["Có","Không","Không biết","Hiếm khi"],0],
["Thông tin cần chính xác?",["Có","Không","Không biết","Hiếm khi"],0],
["Thông tin cần liên quan?",["Có","Không","Không biết","Hiếm khi"],0],
["Thông tin cần tin cậy?",["Có","Không","Không biết","Hiếm khi"],0],

["Thu thập thông tin là bước gì?",["Quan trọng","Không cần","Sai","Không"],0],
["Thông tin giúp giải quyết nhiệm vụ?",["Có","Không","Không biết","Hiếm khi"],0],
["Thông tin giúp học sinh học tốt hơn?",["Có","Không","Không biết","Hiếm khi"],0],
["Thông tin giúp đưa ra quyết định đúng?",["Có","Không","Không biết","Hiếm khi"],0],
["Thông tin giúp giải quyết vấn đề nhanh?",["Có","Không","Không biết","Hiếm khi"],0],

["Thông tin cần phân tích?",["Có","Không","Không biết","Hiếm khi"],0],
["Thông tin cần đánh giá?",["Có","Không","Không biết","Hiếm khi"],0],
["Thông tin cần so sánh?",["Có","Không","Không biết","Hiếm khi"],0],
["Thông tin cần chọn lọc?",["Có","Không","Không biết","Hiếm khi"],0],
["Thông tin cần kiểm tra nguồn?",["Có","Không","Không biết","Hiếm khi"],0]

]

questions.sort(()=>Math.random()-0.5)

/* biến */

let current=0
let correctCount=0
let wrongCount=0
let lock=false

/* timer */

let totalTime=1800
let timer

function startTimer(){

timer=setInterval(()=>{

totalTime--

let m=Math.floor(totalTime/60)
let s=totalTime%60

time.innerText=
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0')

if(totalTime<=0){

finish()

}

},1000)

}

/* start */

function start(){

studentName=document.getElementById("name").value.trim()

if(studentName==""){
alert("Nhập tên học sinh")
return
}

quiz.style.display="block"

startTimer()

load()

}

/* load câu hỏi */

function load(){

lock=false

correctText.innerText=""

progress.style.width=(current/questions.length*100)+"%"

question.innerText="Câu "+(current+1)+": "+questions[current][0]

let ans=
questions[current][1]
.map((a,i)=>({t:a,i}))
.sort(()=>Math.random()-0.5)

answers.innerHTML=""

ans.forEach((a,k)=>{

answers.innerHTML+=
`<div class="answer a${k}" onclick="choose(${a.i})">${a.t}</div>`

})

}

/* chọn đáp án */

function choose(i){

if(lock) return

lock=true

let correct=questions[current][2]

let correctAns=questions[current][1][correct]

document.querySelectorAll(".answer").forEach(el=>{

if(el.innerText===correctAns)
el.classList.add("correct")
else
el.classList.add("wrong")

})

if(i===correct){
correctCount++
}else{
wrongCount++
}

correctText.innerText="Đáp án đúng: "+correctAns

setTimeout(()=>{

current++

if(current<questions.length){
load()
}else{
finish()
}

},1200)

}

/* kết thúc */

function finish(){

clearInterval(timer)

quiz.style.display="none"

let total=questions.length

let percent=Math.round(correctCount/total*100)

result.innerHTML=
"<h2>Hoàn thành bài</h2>"+
"<p>Học sinh: "+studentName+"</p>"+
"<h3>Tổng câu: "+total+"</h3>"+
"<h3>Đúng: "+correctCount+"</h3>"+
"<h3>Sai: "+wrongCount+"</h3>"+
"<h3>Tỷ lệ đúng: "+percent+"%</h3>"

}

</script>

</body>
</html>
