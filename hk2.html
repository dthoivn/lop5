<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Kiểm tra Tin học Lớp 5</title>

<style>
body {
    font-family: Arial;
    margin: 20px;
}

h1, h2 {
    text-align: center;
}

.question {
    margin: 15px 0;
    padding: 10px;
    border-radius: 8px;
}

.correct {
    background-color: #c8f7c5;
}

.wrong {
    background-color: #f7c5c5;
}

#timer {
    font-size: 20px;
    text-align: center;
    color: red;
    font-weight: bold;
}

button {
    padding: 10px 20px;
    font-size: 16px;
    display: block;
    margin: 20px auto;
}
</style>
</head>

<body>

<h1>KIỂM TRA TIN HỌC LỚP 5</h1>
<p id="timer">Thời gian còn lại: 35:00</p>

<h2>PHẦN I: TRẮC NGHIỆM</h2>

<form id="quiz">

<div class="question" id="q1">
<b>Câu 1:</b><br>
<input type="radio" name="q1" value="A"> A<br>
<input type="radio" name="q1" value="B"> B<br>
<input type="radio" name="q1" value="C"> C<br>
<input type="radio" name="q1" value="D"> D<br>
</div>

<div class="question" id="q2">
<b>Câu 2:</b><br>
<input type="checkbox" name="q2" value="A"> A<br>
<input type="checkbox" name="q2" value="B"> B<br>
<input type="checkbox" name="q2" value="C"> C<br>
<input type="checkbox" name="q2" value="D"> D<br>
</div>

<div class="question" id="q3">
<b>Câu 3:</b><br>
<input type="radio" name="q3" value="A"> A<br>
<input type="radio" name="q3" value="B"> B<br>
<input type="radio" name="q3" value="C"> C<br>
<input type="radio" name="q3" value="D"> D<br>
</div>

<div class="question" id="q4">
<b>Câu 4:</b><br>
<input type="radio" name="q4" value="A"> A<br>
<input type="radio" name="q4" value="B"> B<br>
<input type="radio" name="q4" value="C"> C<br>
<input type="radio" name="q4" value="D"> D<br>
</div>

<div class="question" id="q5">
<b>Câu 5:</b><br>
<input type="radio" name="q5" value="A"> A<br>
<input type="radio" name="q5" value="B"> B<br>
<input type="radio" name="q5" value="C"> C<br>
<input type="radio" name="q5" value="D"> D<br>
</div>

<div class="question" id="q6">
<b>Câu 6:</b><br>
<input type="radio" name="q6" value="A"> A<br>
<input type="radio" name="q6" value="B"> B<br>
<input type="radio" name="q6" value="C"> C<br>
<input type="radio" name="q6" value="D"> D<br>
</div>

<div class="question" id="q7">
<b>Câu 7:</b> (tự luận - không chấm tự động)
</div>

<div class="question" id="q8">
<b>Câu 8:</b><br>
<input type="radio" name="q8" value="A"> A<br>
<input type="radio" name="q8" value="B"> B<br>
<input type="radio" name="q8" value="C"> C<br>
<input type="radio" name="q8" value="D"> D<br>
</div>

<div class="question" id="q9">
<b>Câu 9:</b><br>
<input type="radio" name="q9" value="A"> A<br>
<input type="radio" name="q9" value="B"> B<br>
<input type="radio" name="q9" value="C"> C<br>
<input type="radio" name="q9" value="D"> D<br>
</div>

<button type="button" onclick="submitQuiz()">Nộp bài</button>

</form>

<h2 id="result"></h2>

<script>

// Đáp án (ẩn)
const answers = {
    q1: "B",
    q2: ["B","D"],
    q3: "C",
    q4: "A",
    q5: "D",
    q6: "D",
    q8: "B",
    q9: "B"
};

// TIMER 35 phút
let time = 35 * 60;

const timer = setInterval(() => {
    let min = Math.floor(time / 60);
    let sec = time % 60;

    document.getElementById("timer").innerText =
        "Thời gian còn lại: " + min + ":" + (sec < 10 ? "0" : "") + sec;

    time--;

    if (time < 0) {
        clearInterval(timer);
        submitQuiz();
    }
}, 1000);

// CHẤM ĐIỂM
function submitQuiz() {

    let score = 0;

    for (let q in answers) {

        let correct = answers[q];
        let user;

        if (Array.isArray(correct)) {
            user = Array.from(document.querySelectorAll(`input[name=${q}]:checked`)).map(e => e.value);

            if (JSON.stringify(user.sort()) === JSON.stringify(correct.sort())) {
                score++;
                document.getElementById(q).classList.add("correct");
            } else {
                document.getElementById(q).classList.add("wrong");
            }

        } else {
            let selected = document.querySelector(`input[name=${q}]:checked`);

            if (selected && selected.value === correct) {
                score++;
                document.getElementById(q).classList.add("correct");
            } else {
                document.getElementById(q).classList.add("wrong");
            }
        }
    }

    document.getElementById("result").innerText = "Điểm: " + score + "/8";

    // khóa không cho sửa
    document.querySelectorAll("input").forEach(e => e.disabled = true);
}

</script>

</body>
</html>
